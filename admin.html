<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raiffy Admin</title>
<meta name="description" content="Concept operator and admin console for Raiffy: edit the product catalog and parameters with approval, and see chat analytics.">
<!--
  Raiffy Admin (admin.html): operators and admins keep the catalog and parameters current and read chat analytics.
  Spec: raiffy-spec/docs/shared/console.md. Front end only: roles, saving and publishing are simulated in memory.
  Mode: Daylight only (a working tool). Accent as light; ink #1A1A1A for selection; --danger only for errors and stale values.
  Routes: #home · #products · #products/<id> · #rules · #analytics · #audit. Later pages are listed but disabled.
  Logic mirrors lib/calc (impact preview) and lib/analytics (summarize); move both there at conversion.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens (shared with raiffy.html and chat.html) ───────────── */
:root {
  --font-sans: "Geist", "Instrument Sans", "Inter Tight", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --text-body: 15px; --lh-body: 1.6;
  --text-sm: 14px;
  --text-xs: 13px;

  --radius-card: 20px; --radius-btn: 10px;
  --accent-a: #FFD23F; --accent-b: #FF9A3D;
  --ink: #1A1A1A;
  --halo: 0 0 0 4px rgba(255,210,63,.35);
  --danger: #B42318;     /* errors and stale values only */

  --bg: #FAF9F7; --surface: #FFFFFF; --surface-2: #F4F3F0;
  --border: rgba(20,20,20,.07); --border-strong: rgba(20,20,20,.12);
  --text-1: #1A1A1A; --text-2: #5C5C5F; --text-3: #8E8E93;
  --shadow-card: 0 1px 2px rgba(0,0,0,.04); --shadow-float: 0 8px 30px rgba(20,20,40,.08);

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: var(--text-body); line-height: var(--lh-body); color: var(--text-1); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.micro { font-size: 11.5px; color: var(--text-3); }
.eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; text-decoration: none; }
.skip:focus { top: 12px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-btn);
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; font: 500 var(--text-xs)/1 var(--font-sans);
  transition: transform 160ms var(--ease-out), background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
.btn svg { width: 15px; height: 15px; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-ghost { background: var(--surface); color: var(--text-1); border-color: var(--border-strong); }
.btn:disabled { cursor: default; }
.btn-dark:disabled { background: #D9D5CB; color: #fff; }
.btn-ghost:disabled { color: var(--text-3); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
.btn-xs { height: 28px; padding: 0 10px; font-size: 12px; gap: 6px; }
.btn-xs svg { width: 13px; height: 13px; }
.icon-btn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent;
  color: var(--text-2); cursor: pointer; transition: color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:active { transform: scale(.94); }
.link { border: 0; padding: 0; background: none; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-1); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
@media (hover: hover) and (pointer: fine) {
  .btn-dark:hover:not(:disabled) { background: #2A2A2A; }
  .btn-ghost:hover:not(:disabled) { border-color: rgba(20,20,20,.24); }
  .icon-btn:hover { color: var(--text-1); background: rgba(20,20,20,.05); }
  .link:hover { text-decoration-color: var(--ink); }
}

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; line-height: 1.5;
  color: var(--c, #5C5C5F); background: color-mix(in srgb, var(--c, #5C5C5F) 12%, transparent); white-space: nowrap; }
.pill svg { width: 11px; height: 11px; }
.pill.p-pending { --c: #8A6A00; background: #FFF3C4; }
.pill.p-scheduled { --c: #5C5C5F; }
.pill.p-draft { --c: #8E8E93; }
.pill.p-published { --c: #1A1A1A; }
.pill.p-rejected, .pill.p-stale { --c: var(--danger); }
.pill.p-due { --c: #7A5A00; background: #FFF8DC; }
.pill.p-ink { color: #fff; background: var(--ink); }
.src { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  font-size: 11px; color: var(--text-2); text-decoration: none; white-space: nowrap; transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease; }
.src svg { width: 11px; height: 11px; }
@media (hover: hover) and (pointer: fine) { .src:hover { border-color: rgba(200,150,20,.4); background: #FFF8DC; color: var(--text-1); } }
.stale { color: var(--danger); }
.stale-ic { display: inline-flex; align-items: center; gap: 4px; color: var(--danger); }
.stale-ic svg { width: 12px; height: 12px; }
.ok-ic { color: #2E7D4F; }
.ins { padding: 0 4px; border-radius: 4px; background: #FFF3C4; color: var(--text-1); }
.del { color: var(--text-3); text-decoration: line-through; }
.err { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 1.4; color: var(--danger); }
.err svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }
.ava { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 600;
  background: linear-gradient(135deg, #E9D8B4, #C9A86A); color: #4A3610; }
.ava.sm { width: 20px; height: 20px; font-size: 11px; }
.who { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* Segmented control: selection in ink */
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); }
.seg button { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 12.5px; color: var(--text-2);
  white-space: nowrap; transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
@media (hover: hover) and (pointer: fine) { .seg button:not([aria-pressed="true"]):hover { color: var(--text-1); background: rgba(20,20,20,.04); } }

/* Inputs */
.input { display: flex; align-items: center; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 9px; background: #fff;
  transition: border-color 150ms ease, box-shadow 150ms ease; }
.input:focus-within { border-color: var(--ink); box-shadow: var(--halo); }
.input:has(input:disabled) { background: var(--surface-2); color: var(--text-2); }
textarea.ta:disabled { background: var(--surface-2); color: var(--text-2); }
.input input, .input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 13px; font-variant-numeric: tabular-nums; }
.input .unit { flex: none; margin-left: 6px; font: 400 11.5px var(--font-mono); color: var(--text-3); }
.input svg { width: 14px; height: 14px; color: var(--text-3); margin-right: 8px; flex: none; }
.input.is-invalid { border-color: var(--danger); }
.input.is-invalid:focus-within { box-shadow: 0 0 0 4px rgba(180,35,24,.12); }
textarea.ta { display: block; width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 9px; background: #fff; resize: vertical;
  font-size: 13px; line-height: 1.5; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
textarea.ta:focus { border-color: var(--ink); box-shadow: var(--halo); }
textarea.ta.is-invalid { border-color: var(--danger); }
.lbl { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); }

/* ───────────── App shell (from chat.html) ───────────── */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-height: 0; padding: 14px 12px 12px; background: var(--surface-2); border-right: 1px solid var(--border); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: -.01em; border-radius: 6px; }
.logo-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-a); display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset; }
.logo-mark svg { width: 14px; height: 14px; color: #1A1A1A; stroke-width: 2.2; }
.logo small { font-size: 11.5px; font-weight: 500; color: var(--text-3); margin-left: -4px; }
.side-top { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 4px 0 6px; }
.nav { flex: 1; min-height: 0; overflow-y: auto; margin: 8px -4px 0; padding: 0 4px 16px; }
.grp { display: block; padding: 16px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-decoration: none; font-size: 13.5px; color: var(--text-2);
  transition: background-color 150ms ease, color 150ms ease; }
.nav-item > svg { width: 15px; height: 15px; flex: none; color: var(--text-3); }
.nav-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item small { flex: none; min-width: 18px; padding: 0 5px; border-radius: 999px; text-align: center; font: 500 11px/18px var(--font-mono); color: var(--text-3); }
.nav-item small.hot { background: #FFF3C4; color: #7A5A00; }
.nav-item small.bad { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.nav-item[aria-current="page"] { background: var(--surface); color: var(--text-1); box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 1px var(--border); }
.nav-item[aria-current="page"] > svg { color: var(--text-1); }
.nav-item.is-later { opacity: .55; cursor: default; }
@media (hover: hover) and (pointer: fine) { a.nav-item:not([aria-current="page"]):hover { background: rgba(20,20,20,.04); color: var(--text-1); } }
.me { display: grid; gap: 10px; padding: 12px 6px 0; border-top: 1px solid var(--border); }
.me-row { display: flex; align-items: center; gap: 10px; }
.back-chat { width: 100%; }
.me-row div { flex: 1; min-width: 0; line-height: 1.3; }
.me-row b { display: block; font-size: 13px; font-weight: 500; }
.me-row small { font-size: 11.5px; color: var(--text-3); }
.role-switch { display: grid; gap: 6px; }
.role-switch .seg { display: grid; grid-template-columns: 1fr 1fr; }
.role-switch .micro { display: flex; align-items: center; gap: 6px; }
.role-switch .micro svg { width: 12px; height: 12px; }

.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--border); background: var(--bg); }
.top .menu { display: none; margin-left: -8px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); }
.crumbs a { text-decoration: none; color: var(--text-3); }
.crumbs svg { width: 13px; height: 13px; flex: none; }
.top h1 { font-size: 15px; letter-spacing: -.01em; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sim { flex: none; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.page:focus { outline: none; }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 24px 72px; overflow-x: clip; }
.pg-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.pg-head > div { max-width: 640px; }
.pg-head h2 { font-size: 20px; line-height: 1.3; letter-spacing: -.02em; }
.pg-head p { margin-top: 6px; font-size: 14px; line-height: 1.55; color: var(--text-2); }
.sec { margin-top: 32px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sec-h h3 { font-size: 16px; letter-spacing: -.01em; }
.sec-h p { font-size: 13px; color: var(--text-3); }

/* Cards */
.gcard { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.gc-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.gc-h > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.gc-h svg { width: 14px; height: 14px; color: var(--text-2); }
.gc-h .micro { font-weight: 400; }
.gc-b { padding: 16px; }
.gc-note { padding: 10px 16px; border-top: 1px solid var(--border); background: #FBFAF8; font-size: 11.5px; color: var(--text-3); }

/* KPI strip: one bordered card, hairline dividers */
.kpis { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-card); }
.kpi { padding: 14px 16px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--border); }
.kpi .k { font-size: 12px; color: var(--text-3); }
.kpi .v { margin-top: 4px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .s { margin-top: 2px; font-size: 11.5px; color: var(--text-3); }
@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi + .kpi { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--border); }
  .kpi:nth-child(even) { border-left: 1px solid var(--border); }
}

/* Tables: hairline rows, mono tabular numbers */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 9px 14px; text-align: left; font-size: 11.5px; font-weight: 500; color: var(--text-3); white-space: nowrap; border-bottom: 1px solid var(--border); }
.tbl td { padding: 11px 14px; border-top: 1px solid var(--border); vertical-align: middle; font-variant-numeric: tabular-nums; }
.tbl tr:first-child td { border-top: 0; }
.tbl .r { text-align: right; }
.tbl .nm b { display: block; font-weight: 500; }
.tbl .nm small { display: block; font-size: 11.5px; color: var(--text-3); }
.tbl tr.click { cursor: pointer; transition: background-color 150ms ease; }
.tbl tr.hl td { background: #FFF8DC; }
/* Users and roles: edits stay pending until the table's save bar saves them all */
/* Users and roles: edits stay pending until the table's save bar saves them all. Phone first (§12): each row is a
   stacked card with label-over-value cells and 44px fields at 16px; from 640px it's the table. */
.tbl tr.is-edited td, .usr-tbl tr.is-edited { background: #FFF8DC; }
.usr-card .gc-h { flex-wrap: wrap; }
.save-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; width: 100%; font-weight: 400; }
.save-bar .cnt { flex: 1 1 100%; font-size: 13px; color: var(--text-2); }
.save-bar .input { flex: 1 1 100%; height: 44px; }
.save-bar .input input { font-size: 16px; }
.save-bar .btn { height: 44px; flex: 1 1 0; }
.usr-tbl thead { display: none; }
.usr-tbl, .usr-tbl tbody, .usr-tbl tr, .usr-tbl td { display: block; }
.usr-tbl tr { padding: 12px 16px; border-top: 1px solid var(--border); }
.usr-tbl tr:first-child { border-top: 0; }
.usr-tbl td { padding: 6px 0; border-top: 0; }
.usr-tbl td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 4px; font-size: 11.5px; color: var(--text-3); }
.usr-tbl td.mono { white-space: nowrap; }
.usr-tbl .usr-sel { width: 100%; height: auto; }
.usr-tbl select { min-height: 44px; }
.usr-tbl select { font-size: 16px; }
.usr-tbl .micro, .usr-card .gc-note { font-size: 13px; }
@media (min-width: 640px) {
  .usr-card .gc-h { flex-wrap: nowrap; }
  .save-bar { justify-content: flex-end; width: auto; }
  .save-bar .cnt { flex: none; font-size: 12.5px; }
  .save-bar .input { flex: none; width: 200px; height: 32px; }
  .save-bar .input input { font-size: inherit; }
  .save-bar .btn { height: 32px; flex: none; }
  .usr-tbl { display: table; }
  .usr-tbl thead { display: table-header-group; }
  .usr-tbl tbody { display: table-row-group; }
  .usr-tbl tr { display: table-row; padding: 0; border-top: 0; }
  .usr-tbl td { display: table-cell; padding: 11px 14px; border-top: 1px solid var(--border); }
  .usr-tbl tr:first-child td { border-top: 0; }
  .usr-tbl td[data-label]::before { content: none; }
  .usr-tbl .usr-sel { width: 150px; height: 32px; }
  .usr-tbl .usr-sel.wide { width: 210px; }
  .usr-tbl select { font-size: inherit; min-height: 0; }
  .usr-tbl .micro, .usr-card .gc-note { font-size: 11.5px; }
}
/* Touch screens keep 44px controls at every width */
@media (pointer: coarse) {
  .save-bar .input, .save-bar .btn { height: 44px; }
  .usr-tbl .usr-sel { height: auto; }
  .usr-tbl select { min-height: 44px; }
}
.tbl td.go { width: 36px; color: var(--text-3); }
.tbl td.go svg { width: 15px; height: 15px; }
/* The other tables follow the same phone-first card (§12): the first cell as the title, the rest label over value
   (labelCells() copies the column headers into data-label); from 640px it's the table. Users and roles has its own above. */
.tbl:not(.usr-tbl) thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.tbl:not(.usr-tbl) tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--border); }
.tbl:not(.usr-tbl) tr:first-child { border-top: 0; }
.tbl:not(.usr-tbl) td { min-width: 0; padding: 0; border: 0; }
.tbl:not(.usr-tbl) td:first-child, .tbl:not(.usr-tbl) td[colspan] { grid-column: 1 / -1; }
.tbl:not(.usr-tbl) td[data-label]:not(:first-child)::before { content: attr(data-label); display: block; margin-bottom: 2px; font-size: 11.5px; color: var(--text-3); }
.tbl:not(.usr-tbl) .r { text-align: left; }
.tbl:not(.usr-tbl) td.go { display: none; }
.tbl:not(.usr-tbl) tr.hl { background: #FFF8DC; }
.tbl:not(.usr-tbl) tr.click { position: relative; }
.tbl:not(.usr-tbl) tr.click td:first-child a { position: static; }
.tbl:not(.usr-tbl) tr.click td:first-child a::before { content: ""; position: absolute; inset: 0; }
.tbl:not(.usr-tbl) tr.click :is(button, td:not(:first-child) a) { position: relative; z-index: 1; }
@media (min-width: 640px) {
  .tbl:not(.usr-tbl) thead { position: static; width: auto; height: auto; overflow: visible; clip-path: none; white-space: normal; }
  .tbl:not(.usr-tbl) tr { display: table-row; padding: 0; border-top: 0; }
  .tbl:not(.usr-tbl) tr.hl { background: none; }
  .tbl:not(.usr-tbl) td { padding: 11px 14px; border-top: 1px solid var(--border); }
  .tbl:not(.usr-tbl) tr:first-child td { border-top: 0; }
  .tbl:not(.usr-tbl) td[data-label]:not(:first-child)::before { content: none; }
  .tbl:not(.usr-tbl) .r { text-align: right; }
  .tbl:not(.usr-tbl) td.go { display: table-cell; }
  .tbl:not(.usr-tbl) tr.click td:first-child a::before { content: none; }
}
@media (hover: hover) and (pointer: fine) { .tbl tr.click:hover td { background: #FBFAF8; } }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.empty-row { padding: 28px 16px; text-align: center; font-size: 13px; color: var(--text-3); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.filters .input { width: 240px; }
.filters .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }

.frow { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 6px 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); transition: background-color 150ms ease; }

.banner { border-color: rgba(200,150,20,.35); }

@media (max-width: 480px) { .prm-form { grid-template-columns: 1fr; } .prm-form .wide { grid-column: auto; } }

/* Funnel and bar lists: one hue (ink), a light track, rounded data ends */
.fn { display: grid; gap: 8px; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: #fff; box-shadow: var(--shadow-float); font-size: 13px; line-height: 1.45; }

.toast small { display: block; color: rgba(255,255,255,.66); font-size: 12px; }

/* Drawer */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20,20,20,.28); }
@media (max-width: 859px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); box-shadow: 20px 0 50px rgba(20,20,40,.12);
    transform: translateX(-100%); visibility: hidden; transition: transform 260ms var(--ease-out), visibility 0s linear 260ms; }
  .app.side-open .side { transform: none; visibility: visible; transition: transform 260ms var(--ease-out), visibility 0s; }
  .top { padding: 0 12px 0 16px; }
  .top .menu { display: grid; }
  .top .sim { display: none; }
  .page { padding: 20px 16px 56px; }
  .filters .input { width: 100%; }
}

/* ───────────── Motion ───────────── */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: no-preference) {
  .page.enter > * { animation: rise 420ms var(--ease-out) backwards; }
  .page.enter > *:nth-child(2) { animation-delay: 60ms; }
  .page.enter > *:nth-child(3) { animation-delay: 120ms; }
  .page.enter > *:nth-child(4) { animation-delay: 180ms; }
  .page.enter > *:nth-child(n+5) { animation-delay: 240ms; }
  .page.enter .fn-row .tr i { transform-origin: left; animation: grow 600ms var(--ease-out) backwards 200ms; }
  .toast { animation: rise 260ms var(--ease-out) backwards; }
  .scrim:not([hidden]) { animation: fade 200ms ease; }
}
@media (prefers-reduced-motion: reduce) {
  .page.enter > * { animation: fade 200ms ease backwards; }
  .side { transition-duration: 0s !important; }
}

/* §12-touch:start */
/* ── §12 Mobile: touch layer. The same core sits in every prototype, keep the copies identical; page parts follow it ── */
@media (pointer: coarse) {
  /* Every control reaches a 44×44 hit area through ::before, while the drawn box keeps its size */
  :where(button, [role="button"], [role="tab"], [role="switch"], a.btn, a.qbtn, a.chip, a.src, a.logo, a.back, a.link, a.t-main, summary, label.check) { position: relative; }
  :where(button, [role="button"], [role="tab"], [role="switch"], a.btn, a.qbtn, a.chip, a.src, a.logo, a.back, a.link, a.t-main, summary, label.check)::before {
    content: ""; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
  /* Text fields at 16px so iOS doesn't zoom, 44px tall; sliders get a 44px box around the 4px track */
  :is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="hidden"]), select, textarea) { font-size: 16px; }
  :is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="hidden"]), select) { min-height: 44px; }
  input[type="range"] { height: 44px; }
}
@media (pointer: coarse) {
  .icon-btn { width: 36px; height: 36px; }
  /* Segmented filters draw at 40px; the 2px padding around them holds the rest of the hit area */
  .seg button { height: 40px; min-width: 44px; }
  .input { height: 44px; }
  .tog { height: 40px; }
}
/* §12-touch:end */

  function impactHTML(e) {

        (T.compare ? (flips.length ? 'The recommendation flips in ' + flips.length + ' of ' + rows.length + ' cases.' : 'The recommendation is unchanged.') : '');
    }
    return '<p class="imp-sum">' + sum + '</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Case</th><th class="r">' + metric + '</th>' + (T.compare ? '<th>Recommended</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        var moved = Math.abs(r.delta) > .004;
        return '<tr' + (r.rec && r.rec.changed ? ' class="hl"' : '') + '><td class="mono" style="font-size:12px">' + num(r.c.amount) + ' lei · ' + r.c.months + ' mo</td>' +
          '<td class="r mono" style="font-size:12px">' + (moved ? '<span class="del">' + num(r.before, 0) + '</span> ' : '') + '<b style="font-weight:500">' + num(r.after, 0) + ' lei</b>' + (moved ? '<span class="micro"> ' + (r.delta > 0 ? '+' : '−') + num(Math.abs(r.delta), 0) + '</span>' : '') + '</td>' +
          (r.rec ? '<td style="font-size:12px">' + (r.rec.changed ? '<span class="del">' + recName(r.rec.before) + '</span> → <b style="font-weight:500">' + recName(r.rec.after) + '</b>' : recName(r.rec.after)) + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="gc-note">Calculated with lib/calc · near-tie margin ' + num(param('near-tie')) + ' lei' + (T.compare ? ' · compared with the published ' + (T.compare === 'overdraft' ? 'overdraft' : 'personal loan') : '') + '</div>';
  }
  function recName(k) { return k === 'loan' ? 'Loan' : 'Overdraft'; }

  function publishHTML(e) {
    var pend = pendingOf(e), d = editDiff(), nv = e.versions.length + 1;
    if (pend) return '<p class="imp-empty">' + (isAdmin() ? 'Approve or reject the pending change first. There is one open proposal per item.' : pend.proposedBy === me() ? 'Your change is waiting for an admin. Withdraw it to make a different one.' : 'Another change is waiting for an admin.') + '</p>';
    var badSrc = Object.keys(EDIT.data.values).filter(function (k) { return EDIT.data.values[k].value !== EDIT.from.data.values[k].value && !validUrl(EDIT.data.values[k].sourceUrl); });
    var badVal = Object.keys(EDIT.data.values).filter(function (k) { var v = EDIT.data.values[k].value; return typeof v !== 'number' || isNaN(v) || v < 0; });
    var errs = [];
    if (EDIT.tried && badVal.length) errs.push('Enter a number of 0 or more for ' + badVal.map(function (k) { return FIELDS[k].label.toLowerCase(); }).join(', ') + '.');
    if (EDIT.tried && badSrc.length) errs.push('Add a source link for ' + badSrc.map(function (k) { return FIELDS[k].label.toLowerCase(); }).join(', ') + '.');
    if (EDIT.tried && EDIT.when === 'date' && !(EDIT.date > TODAY)) errs.push('Pick a date after today.');
    return '<div class="pub">' +
      (d.length ? '<div class="gcard" style="box-shadow:none">' + diffTable(d) + '</div>' : '<p class="micro">No changes yet. Edit a value on the left.</p>') +
      '<div><span class="lbl">Valid from</span><div class="when"><div class="seg" role="group" aria-label="Valid from"><button type="button" data-act="when" data-v="now" aria-pressed="' + (EDIT.when === 'now') + '">' + (isAdmin() ? 'Now' : 'On approval') + '</button><button type="button" data-act="when" data-v="date" aria-pressed="' + (EDIT.when === 'date') + '">A later date</button></div>' +
        (EDIT.when === 'date' ? '<label class="input"><span class="sr-only">Date</span><input type="date" id="when-date" value="' + EDIT.date + '" min="' + addDays(TODAY, 1) + '"></label>' : '') + '</div></div>' +
      '<div><label class="lbl" for="pub-note">Reason for the change</label><textarea class="ta" id="pub-note" placeholder="For example: November pricing committee. It goes into the audit log.">' + esc(EDIT.note) + '</textarea></div>' +
      (errs.length ? '<div role="alert" style="display:grid;gap:4px">' + errs.map(function (x) { return '<p class="err">' + ic('circle-alert') + esc(x) + '</p>'; }).join('') + '</div>' : '') +
      '<div class="pub-foot"><span class="grow">' + (isAdmin() ? 'Publishes v' + nv + ' with no further approval.' : 'An admin approves v' + nv + ' before customers see it.') + '</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="discard"' + (d.length ? '' : ' disabled') + '>Discard</button>' +
        '<button type="button" class="btn btn-dark btn-sm" data-act="commit"' + (d.length ? '' : ' disabled') + '>' + (isAdmin() ? (EDIT.when === 'date' ? 'Schedule v' + nv : 'Publish v' + nv) : 'Submit for approval') + '</button></div>' +
      '<p class="micro">On publish: linked documents and FAQs are re-embedded, and open plans that used v' + EDIT.from.version + ' are marked “Figures updated since this plan”.</p>' +
    '</div>';
  }

  function diffTable(d) {
    return '<div class="tbl-wrap"><table class="tbl diff"><thead><tr><th>Field</th><th>Published</th><th>Proposed</th></tr></thead><tbody>' +
      d.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td class="mono" style="font-size:12px"><span class="del">' + esc(x.from) + '</span></td><td class="mono" style="font-size:12px"><span class="ins">' + esc(x.to) + '</span></td></tr>'; }).join('') +
      '</tbody></table></div>';
  }

  function pendingBanner(e, p) {
    var d = diffData(e.table, base(e).data, p.data), mine = p.proposedBy === me();
    var decide = isAdmin()
      ? '<div class="decide"><div><label class="lbl" for="dec-note">Note <span class="micro">(required to reject)</span></label><textarea class="ta" id="dec-note" rows="2" placeholder="Why you approve or reject it. It goes into the audit log."></textarea></div>' +
        '<p class="err" id="dec-err" hidden>' + ic('circle-alert') + 'Add a reason so ' + esc(USERS[p.proposedBy].name.split(' ')[0]) + ' knows what to change.</p>' +
        '<div class="act-row"><span class="grow micro">' + (p.validFrom > TODAY ? 'Goes live on ' + date(p.validFrom) + ' once approved.' : 'Goes live as soon as you approve it.') + '</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-act="reject" data-t="' + e.table + '" data-id="' + e.entityId + '">Reject</button>' +
        '<button type="button" class="btn btn-dark btn-sm" data-act="approve" data-t="' + e.table + '" data-id="' + e.entityId + '">' + ic('check') + 'Approve and publish</button></div></div>'
      : '<div class="decide"><div class="act-row"><span class="grow micro">' + (mine ? 'Only an admin can publish it. You can withdraw it to make changes.' : 'Waiting for an admin.') + '</span>' +
        (mine ? '<button type="button" class="btn btn-ghost btn-sm" data-act="withdraw" data-t="' + e.table + '" data-id="' + e.entityId + '">Withdraw</button>' : '') + '</div></div>';
    var impact = '';
    if (e.table === 'products' && TYPES[e.type].calc) {
      var rows = impactPreview(e, base(e).data.values, p.data.values);
      var flips = rows.filter(function (r) { return r.rec && r.rec.changed; }).length;
      impact = '<div class="gc-note">Impact on sample cases: ' + rows.map(function (r) { return num(r.c.amount) + ' lei · ' + r.c.months + ' mo ' + num(r.before) + ' → ' + num(r.after) + ' lei'; }).join('; ') +
        (TYPES[e.type].compare ? (flips ? '. Recommendation flips in ' + flips + ' case' + (flips > 1 ? 's' : '') + '.' : '. Recommendation unchanged.') : '.') + '</div>';
    }
    return '<section class="gcard banner" style="margin-bottom:16px" aria-labelledby="pend-h"><div class="gc-h"><span id="pend-h"><span class="ic">' + ic('hourglass') + '</span>Pending change · v' + p.version + '</span><span class="micro">' + userChip(p.proposedBy) + ' · ' + date(p.createdAt) + '</span></div>' +
      (p.note ? '<p class="imp-sum">“' + esc(p.note) + '”</p>' : '') + diffTable(d) + impact + decide + '</section>';
  }

  function historyCard(e) {
    var cur = current(e), vs = e.versions.slice().reverse();
    return '<section class="gcard fgroup" aria-labelledby="hist-h"><div class="gc-h"><span id="hist-h">' + ic('history') + 'Version history</span><span class="micro">' + e.versions.length + ' versions</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Version</th><th>Status</th><th>Change</th><th>By</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
      vs.map(function (v) {
        var prev = e.versions.filter(function (x) { return x.version < v.version && (x.status === 'published' || x.status === 'draft'); }).pop();
        var d = prev ? diffData(e.table, prev.data, v.data) : [];
        var st = v === cur ? '<span class="pill p-ink">Current</span>' : v.status === 'published' ? (v.validFrom > TODAY ? '<span class="pill p-scheduled">Scheduled</span>' : '<span class="pill p-draft">Superseded</span>') :
          '<span class="pill p-' + (v.status === 'superseded' || v.status === 'withdrawn' ? 'draft' : v.status) + '">' + v.status.charAt(0).toUpperCase() + v.status.slice(1) + '</span>';
        var canRoll = cur && v.status === 'published' && v.validFrom <= TODAY && v.version < cur.version && !pendingOf(e);
        return '<tr><td class="mono">v' + v.version + '</td><td>' + st + '</td><td><div class="aud-diff">' +
          (d.length ? d.map(function (x) { return '<div>' + esc(x.label) + ' <span class="del">' + esc(x.from) + '</span> → ' + esc(x.to) + '</div>'; }).join('') : '') +
          '<div class="micro">' + esc(v.note || '') + (v.rejectReason ? ' · Rejected: ' + esc(v.rejectReason) : '') + '</div></div></td>' +
          '<td style="font-size:12.5px">' + userChip(v.proposedBy) + '<div class="micro">' + date(v.createdAt) + (v.approvedBy ? ' · approved by ' + esc(USERS[v.approvedBy].name) : '') + '</div></td>' +
          '<td class="r">' + (canRoll ? '<button type="button" class="btn btn-ghost btn-xs" data-act="rollback" data-id="' + e.entityId + '" data-v="' + v.version + '">' + ic('rotate-ccw') + (isAdmin() ? 'Roll back' : 'Propose rollback') + '</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  /* Partial updates while typing: keep focus by touching only the changed row, the preview and the publish panel. */
  function refreshEditor() {
    var e = entity('products', EDIT.id);
    Object.keys(EDIT.data.values).forEach(function (k) {
      var row = document.querySelector('[data-row="' + k + '"]'); if (!row) return;
      var changed = EDIT.data.values[k].value !== EDIT.from.data.values[k].value;
      row.classList.toggle('changed', changed);
      var now = row.querySelector('[data-now]'); if (now) now.textContent = isNaN(EDIT.data.values[k].value) ? '—' : fmtVal(k, EDIT.data.values[k].value);
      var w = row.querySelector('[data-srcwrap]'); if (w) w.classList.toggle('is-invalid', EDIT.tried && changed && !validUrl(EDIT.data.values[k].sourceUrl));
    });
    var imp = $('impact'); if (imp) imp.innerHTML = impactHTML(e);
    refreshPublish();
  }
  function refreshPublish() {
    var e = entity('products', EDIT.id), pub = $('pub');
    if (!pub) return;
    var focusId = document.activeElement && document.activeElement.id;
    var caret = focusId === 'pub-note' ? document.activeElement.selectionStart : null;
    pub.innerHTML = publishHTML(e);
    var n = editDiff().length; $('pub-count').textContent = n ? n + ' change' + (n > 1 ? 's' : '') : '';
    icons();
    if (focusId && $(focusId)) { $(focusId).focus(); if (caret != null) $(focusId).setSelectionRange(caret, caret); }
  }

  function commitEdit() {
    var e = entity('products', EDIT.id);
    EDIT.tried = true;
    var bad = Object.keys(EDIT.data.values).some(function (k) {
      var v = EDIT.data.values[k];
      return typeof v.value !== 'number' || isNaN(v.value) || v.value < 0 || (v.value !== EDIT.from.data.values[k].value && !validUrl(v.sourceUrl));
    }) || (EDIT.when === 'date' && !(EDIT.date > TODAY));
    if (bad) { refreshEditor(); var a = document.querySelector('#pub [role="alert"]'); if (a) a.scrollIntoView({ block: 'nearest' }); return; }
    var validFrom = EDIT.when === 'date' ? EDIT.date : TODAY;
    Object.keys(EDIT.data.values).forEach(function (k) { if (EDIT.data.values[k].value !== EDIT.from.data.values[k].value) EDIT.data.values[k].validFrom = validFrom; });
    var r = commit(e, cloneData(EDIT.data), { validFrom: validFrom, note: EDIT.note.trim() });
    EDIT = null;
    if (isAdmin()) toast(validFrom > TODAY ? 'Scheduled ' + e.name + ' v' + r.version.version + ' for ' + date(validFrom) : 'Published ' + e.name + ' v' + r.version.version, 'Re-embedding ' + e.links.docs + ' documents and ' + e.links.faqs + ' FAQs (simulated).');
    else toast('Sent ' + e.name + ' v' + r.version.version + ' for approval', 'Switch to Admin in the sidebar to approve it.');
    render();
  }

  /* ───────────── Rules ───────────── */
  function renderRules() {
    crumbs([['Rules']]);
    return '<div class="pg-head"><div><h2>Rules</h2><p>Two kinds, kept apart on purpose. Parameters are dated values you can edit. Hard limits are behavior rules in code: they are listed here, but changing one is a code change.</p></div></div>' +
      '<section aria-labelledby="prm-h"><div class="sec-h"><h3 id="prm-h">Parameters</h3><p>A value past its review date blocks the answers that need it.</p></div>' +
      '<div class="gcard"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Parameter</th><th class="r">Value</th><th>Source</th><th>Valid from</th><th>Review by</th><th>Owner</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
      DB.parameters.map(paramRows).join('') + '</tbody></table></div></div></section>' +
      '<section class="sec" aria-labelledby="hl-h"><div class="sec-h"><h3 id="hl-h">Hard limits</h3><p>Read-only for everyone. No prompt or form can loosen them.</p></div>' +
      '<div class="gcard"><div class="hl-list">' + HARD_LIMITS.map(function (h) {
        return '<div class="hl"><span class="ic">' + ic(h.icon) + '</span><div><h4>' + esc(h.name) + ' <span class="pill" style="vertical-align:2px">' + ic('lock') + 'In code</span></h4><p>' + esc(h.text) + '</p>' +
          '<div class="evs" aria-label="Protecting eval cases">' + h.evals.map(function (x) { return '<span class="ev">' + x + '</span>'; }).join('') + '</div></div></div>';
      }).join('') + '</div><div class="gc-note">Each limit is protected by the eval cases listed with it. They run on every prompt and code change.</div></div></section>';
  }

  function paramRows(e) {
    var cur = current(e), d = cur.data, rs = reviewState(d.reviewBy), pend = pendingOf(e), open = UI.paramOpen === e.entityId;
    var row = '<tr' + (open ? ' class="hl"' : '') + '><td class="nm"><b>' + esc(e.name) + '</b><small>Used by: ' + esc(e.usedBy) + '</small></td>' +
      '<td class="r mono">' + fmtParam(d) + '</td><td><a class="src" href="' + esc(d.sourceUrl) + '" target="_blank" rel="noopener">' + ic('link') + host(d.sourceUrl) + '</a></td>' +
      '<td class="micro mono">' + dateShort(d.validFrom) + '</td>' +
      '<td>' + (rs === 'stale' ? '<span class="stale-ic">' + ic('triangle-alert') + dateShort(d.reviewBy) + ' · blocking</span>' : rs === 'due' ? '<span class="pill p-due">' + dateShort(d.reviewBy) + '</span>' : '<span class="micro mono">' + dateShort(d.reviewBy) + '</span>') + '</td>' +
      '<td class="micro">' + esc(d.owner) + '</td>' +
      '<td class="r"><div class="act-row" style="justify-content:flex-end;flex-wrap:nowrap">' + (pend ? '<span class="pill p-pending">Pending</span>' : '') +
        '<button type="button" class="btn btn-ghost btn-xs" data-act="param-open" data-id="' + e.entityId + '" aria-expanded="' + open + '">' + (open ? 'Close' : pend ? 'Review' : 'Edit') + '</button></div></td></tr>';
    if (!open) return row;
    var inner;
    if (pend) {
      inner = '<div style="display:grid;gap:12px"><p style="font-size:13px">' + userChip(pend.proposedBy) + ' proposed ' + fmtParam(d) + ' → <span class="ins">' + fmtParam(pend.data) + '</span> on ' + date(pend.createdAt) + (pend.note ? ': “' + esc(pend.note) + '”' : '') + '</p>' +
        (isAdmin() ? '<div><label class="lbl" for="dec-note">Note <span class="micro">(required to reject)</span></label><textarea class="ta" id="dec-note" rows="2"></textarea></div><p class="err" id="dec-err" hidden>' + ic('circle-alert') + 'Add a reason for the rejection.</p>' +
          '<div class="act-row"><span class="grow"></span><button type="button" class="btn btn-ghost btn-sm" data-act="reject" data-t="parameters" data-id="' + e.entityId + '">Reject</button><button type="button" class="btn btn-dark btn-sm" data-act="approve" data-t="parameters" data-id="' + e.entityId + '">' + ic('check') + 'Approve and publish</button></div>'
          : '<div class="act-row"><span class="grow micro">Waiting for an admin.</span>' + (pend.proposedBy === me() ? '<button type="button" class="btn btn-ghost btn-sm" data-act="withdraw" data-t="parameters" data-id="' + e.entityId + '">Withdraw</button>' : '') + '</div>') + '</div>';
    } else {
      inner = '<form class="prm-form" data-pform="' + e.entityId + '" novalidate>' +
        '<div><label class="lbl" for="pv">New value</label><label class="input"><input type="number" id="pv" step="any" min="0" value="' + d.value + '" required><span class="unit">' + esc(d.unit) + '</span></label></div>' +
        '<div class="wide"><label class="lbl" for="ps">Source</label><label class="input"><input type="url" id="ps" value="' + esc(d.sourceUrl) + '" required></label></div>' +
        '<div><label class="lbl" for="pr">Review by</label><label class="input"><input type="date" id="pr" value="' + (rs === 'ok' ? d.reviewBy : addDays(TODAY, 90)) + '" min="' + addDays(TODAY, 1) + '" required></label></div>' +
        '<div class="wide"><label class="lbl" for="pn">Reason for the change</label><textarea class="ta" id="pn" rows="2" placeholder="For example: Q4 IRCC published by BNR."></textarea></div>' +
        '<div class="wide" style="display:grid;align-content:end;gap:8px"><p class="err" id="perr" hidden></p><div class="act-row"><span class="grow micro">' + (isAdmin() ? 'Publishes v' + (e.versions.length + 1) + ' now.' : 'An admin approves it first.') + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-act="param-open" data-id="' + e.entityId + '">Cancel</button><button type="submit" class="btn btn-dark btn-sm">' + (isAdmin() ? 'Publish' : 'Submit for approval') + '</button></div></div>' +
      '</form>';
    }
    return row + '<tr class="prm-ed"><td colspan="7">' + inner + '</td></tr>';
  }

  /* ───────────── Analytics ───────────── */
  function fmtCount(x) { return x === null ? '<span class="supp" title="Hidden: fewer than ' + param('analytics-min') + '">&lt;' + param('analytics-min') + '</span>' : num(x); }
  function fmtShare(x, d) { return x === null ? '<span class="supp" title="Hidden: too few to show">—</span>' : pct(x, d || 0); }
  function stat(label, value) { return '<div class="stat"><span>' + label + '</span><b>' + value + '</b></div>'; }
  function funnel(rows) {
    var top = rows[0][1];
    return '<div class="fn">' + rows.map(function (r) {
      var w = r[1] === null || !top ? 0 : r[1] / top * 100;
      return '<div class="fn-row"><span class="lb">' + r[0] + '</span><span class="tr" aria-hidden="true"><i style="--w:' + w.toFixed(1) + '%"></i></span><span class="ct">' + fmtCount(r[1]) + '</span>' +
        '<span class="pc">' + (r[1] === null || !top ? '' : pct(r[1] / top)) + '</span></div>';
    }).join('') + '</div>';
  }
  function card(title, from, body) {
    return '<section class="gcard" aria-label="' + esc(title) + '"><div class="gc-h"><span>' + title + '</span><span class="an-from">' + from + '</span></div><div class="gc-b">' + body + '</div></section>';
  }

  function renderAnalytics() {
    crumbs([['Analytics']]);
    var f = UI.analytics;
    var seg = function (key, opts) { return '<div class="seg" role="group" aria-label="' + key + '">' + opts.map(function (o) { return '<button type="button" data-act="af" data-k="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (String(f[key]) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>'; };
    return '<div class="pg-head"><div><h2>Analytics</h2><p>How Raiffy uses customers’ account data and what comes of it. Only totals: no customer can be picked out, and counts under ' + param('analytics-min') + ' are hidden.</p></div>' +
      '<span class="pill">' + ic('flask-conical') + 'Pilot traffic · mock data</span></div>' +
      '<div class="filters">' + seg('range', [[7, '7 days'], [30, '30 days'], [90, '90 days']]) + seg('track', [['all', 'All'], ['personal', 'Individuals'], ['business', 'Business']]) +
        seg('entry', [['all', 'All entry points'], ['web', 'Web'], ['smartMobile', 'Smart Mobile']]) + '</div>' +
      '<div id="an-body">' + analyticsBody() + '</div>';
  }

  function analyticsBody() {
    if (!AN) AN = buildAnalytics();
    var f = UI.analytics, to = addDays(TODAY, -1), from = addDays(TODAY, -f.range);
    var s = summarize(AN.answers, AN.events, { from: from, to: to, track: f.track === 'all' ? null : f.track, entry: f.entry === 'all' ? null : f.entry, minCount: param('analytics-min') });
    var k = s.kpis;
    var html = '<div class="kpis" style="--n:5">' +
      kpi('Conversations', fmtCount(k.conversations), fmtCount(k.answers) + ' answers') +
      kpi('Used account data', fmtShare(k.accountDataShare), 'of answers') +
      kpi('Offer take-up', fmtShare(k.offerTakeUp, 1), 'pre-approved, shown → applied') +
      kpi('Fully digital', fmtShare(k.digitalShare), 'of applications') +
      kpi('Money saved', k.moneySavedLei === null ? fmtCount(null) : lei(k.moneySavedLei), 'for customers, from the ledger') + '</div>';

    // Volume
    var max = Math.max.apply(null, s.daily.map(function (d) { return d.answers; })) || 1;
    var nice = Math.ceil(max / 100) * 100, ticks = [nice, nice / 2, 0];
    html += '<section class="gcard sec" aria-labelledby="vol-h"><div class="gc-h"><span id="vol-h">Answers per day</span><span class="an-from">' + date(from) + ' – ' + date(to) + '</span></div><div class="gc-b">' +
      '<div class="vol"><div class="vol-y" aria-hidden="true">' + ticks.map(function (t) { return '<span style="top:' + (100 - t / nice * 100) + '%">' + num(t) + '</span>'; }).join('') + '</div>' +
      '<div class="vol-plot" id="vol-plot"><span class="gl" style="top:0"></span><span class="gl" style="top:50%"></span><span class="gl" style="bottom:0"></span>' +
      '<div class="vol-bars" id="vol-bars" role="img" aria-label="Answers per day, from ' + num(Math.min.apply(null, s.daily.map(function (d) { return d.answers; }))) + ' to ' + num(max) + '. The data table below has every day.">' +
      s.daily.map(function (d, i) { return '<b data-i="' + i + '"><i style="--h:' + (d.answers / nice * 100).toFixed(1) + '%"></i></b>'; }).join('') + '</div>' +
      '<div class="tip" id="vol-tip" hidden></div></div>' +

    html += '</div>';

    html += '<section class="sec" aria-labelledby="q-h"><div class="sec-h"><h3 id="q-h">Assistant quality</h3><p>Where answers needed help. Stale-data blocks point to <a class="link" href="#rules">Rules</a> and <a class="link" href="#products">Products</a>.</p></div>' +
      '<div class="kpis" style="--n:4">' + kpi('Passed checks first time', fmtShare(q.firstPassShare), 'evaluator, no retry') + kpi('Safe fallbacks', fmtCount(q.fallbacks), 'after two failed retries') +

  function kpi(k, v, s) { return '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
  function staleNote() {
    var st = []; DB.products.concat(DB.parameters).forEach(function (e) { staleValues(e).forEach(function (x) { if (x.state === 'stale') st.push(e.name); }); });
    return st.length ? 'now: ' + esc(st.join(', ')) : 'no stale values now';
  }

  function bindVolume() {
    var bars = $('vol-bars'), tip = $('vol-tip'), plot = $('vol-plot');
    if (!bars) return;
    function hide() { tip.hidden = true; bars.classList.remove('hovering'); var on = bars.querySelector('.on'); if (on) on.classList.remove('on'); }
    bars.addEventListener('pointermove', function (ev) {
      var b = ev.target.closest('b'); if (!b) return;
      var d = AN.lastDaily[+b.dataset.i]; var on = bars.querySelector('.on'); if (on !== b) { if (on) on.classList.remove('on'); b.classList.add('on'); }
      bars.classList.add('hovering');
      tip.innerHTML = '<b>' + date(d.date) + '</b><span>' + (d.answers ? num(d.answers) + ' answers' : 'Fewer than ' + param('analytics-min') + ' answers') + '</span><br><span>' + (d.conversations ? num(d.conversations) + ' conversations' : '') + '</span>';
      tip.hidden = false;
      var pr = plot.getBoundingClientRect(), br = b.getBoundingClientRect(), x = br.left - pr.left + br.width / 2;
      tip.style.left = Math.max(0, Math.min(pr.width - tip.offsetWidth, x - tip.offsetWidth / 2)) + 'px';
      tip.style.top = '-8px'; tip.style.transform = 'translateY(-100%)';

  /* ───────────── Sentiment ───────────── */
  /* Mock block, shapes from lib/analytics/sentiment.ts: SentimentEvent { at, conversationKey, customerKey, track, entry, inquiry,
     sentiment, about, confidence, after } and AnswerFeedback { ..., answerKey, vote, reason? }. Labels only, never message text. */
  var SN = null;
  var SENTIMENT_LABEL = { positive: 'Positive', neutral: 'Neutral', confused: 'Confused', frustrated: 'Frustrated', angry: 'Angry' };
  var NEGATIVE = ['confused', 'frustrated', 'angry'];
  var ABOUT_LABEL = { answer: 'Raiffy’s answer', price: 'A rate, fee or price', service: 'The bank’s service', app: 'The app or a payment' };
  var AFTER_LABEL = { first: 'Nothing yet, first message', answered: 'A checked answer', unavailable: 'An answer it couldn’t give', failed: 'A reply that failed',
    stopped: 'A reply the customer stopped', menu: 'A “Which of these is closest?” menu', repeat: 'The same question, asked again' };
  var REASON_LABEL = { wrong: 'Wrong', unclear: 'Unclear', missing: 'Missing information', other: 'Something else' };
  var INQUIRY_LABEL = { purchase_goal: 'Buying something', affordability: 'Can I afford it?', debt_refinancing: 'Refinancing', product_comparison: 'Comparing products',
    product_explanation: 'Explaining a product', fees_statements: 'Fees and statements', saving_goal: 'Saving', listing: 'Listing products', cash_shortfall: 'Short of cash' };
  var INQUIRY_W = [['purchase_goal', 18], ['affordability', 14], ['debt_refinancing', 7], ['product_comparison', 15], ['product_explanation', 14], ['fees_statements', 13], ['saving_goal', 10], ['listing', 6], ['cash_shortfall', 3]];

  function buildSentiment() {
    var rnd = mulberry32(20261029), events = [], feedback = [];
    function pick(w) { var t = 0, i; for (i = 0; i < w.length; i++) t += w[i][1]; var x = rnd() * t; for (i = 0; i < w.length; i++) { x -= w[i][1]; if (x < 0) return w[i][0]; } return w[0][0]; }
    function p(x) { return rnd() < x; }
    var DAYS = 90, start = addDays(TODAY, -DAYS), convN = 0, ansN = 0;
    for (var d = 0; d < DAYS; d++) {
      var day = addDays(start, d), dow = new Date(day + 'T00:00:00Z').getUTCDay();
      var conv = Math.round((70 + d * 1.6) * (dow === 0 || dow === 6 ? .62 : 1) * (.9 + rnd() * .2));
      for (var c = 0; c < conv; c++) {
        var b = { conversationKey: 'cv' + (++convN), customerKey: 'cu' + Math.floor(rnd() * 3200), track: p(.86) ? 'personal' : 'business', entry: p(.58) ? 'smartMobile' : 'web' };
        var hour = 7 + Math.floor(rnd() * 15), inquiry = pick(INQUIRY_W), n = 1 + Math.floor(rnd() * 3.4), prev = 'first';
        for (var m = 0; m < n; m++) {
          // Unhappy messages follow answers Raiffy couldn't give and menus more often; fees and refinancing run hotter.
          var hot = (inquiry === 'fees_statements' ? .08 : inquiry === 'debt_refinancing' ? .05 : 0) + (day >= '2026-10-21' && inquiry === 'saving_goal' ? .1 : 0);
          var neg = { first: .07, answered: .06, unavailable: .34, failed: .4, stopped: .22, menu: .18, repeat: .52 }[prev] + hot;
          var sentiment = p(neg) ? pick([['confused', 5], ['frustrated', 4], ['angry', 1]]) : p(.16) ? 'positive' : 'neutral';
          var about = sentiment === 'neutral' ? 'none' : inquiry === 'fees_statements' && p(.6) ? 'price' : pick([['answer', 5], ['price', 2], ['service', 2], ['app', 1]]);
          var stamp = day + 'T' + String(hour).padStart(2, '0') + ':' + String(m * 4).padStart(2, '0');
          events.push({ at: stamp + ':00Z', conversationKey: b.conversationKey, customerKey: b.customerKey,
            track: b.track, entry: b.entry, inquiry: inquiry, sentiment: sentiment, about: about, confidence: .55 + rnd() * .4, after: prev });
          prev = p(.04) ? 'repeat' : pick([['answered', 78], ['unavailable', inquiry === 'saving_goal' && day >= '2026-10-21' ? 22 : 9], ['menu', 7], ['stopped', 3], ['failed', 1]]);
          if (prev !== 'stopped' && prev !== 'failed' && p(.14)) {
            var down = p(prev === 'unavailable' ? .55 : .17);
            feedback.push({ at: stamp + ':30Z', conversationKey: b.conversationKey, customerKey: b.customerKey, track: b.track, entry: b.entry, answerKey: 'an' + (++ansN),
              vote: down ? 'down' : 'up', reason: down && p(.6) ? pick([['wrong', 3], ['unclear', 4], ['missing', 5], ['other', 1]]) : undefined });
          }
        }
      }
    }
    return { events: events, feedback: feedback };
  }

  /* Mirrors summarizeSentiment in lib/analytics/sentiment.ts: a group with fewer distinct customers than minCount is hidden, and so is any share built on it. */
  function summarizeSentiment(E0, F0, f) {
    var k = f.minCount;
    function inF(r) { var d = r.at.slice(0, 10); return d >= f.from && d <= f.to && (!f.track || r.track === f.track) && (!f.entry || r.entry === f.entry); }
    function people(xs) { var s = {}, n = 0; xs.forEach(function (x) { if (!s[x.customerKey]) { s[x.customerKey] = 1; n++; } }); return n; }
    function shown(xs) { return people(xs) >= k; }
    function n(xs) { return shown(xs) ? xs.length : null; }
    function share(part, whole) { return shown(whole) && shown(part) ? part.length / whole.length : null; }
    function isNeg(e) { return NEGATIVE.indexOf(e.sentiment) >= 0; }
    function by(xs, key) { var m = {}; xs.forEach(function (x) { (m[key(x)] = m[key(x)] || []).push(x); }); return m; }
    var E = E0.filter(inF), neg = E.filter(isNeg);
    var convs = Object.values(by(E, function (e) { return e.conversationKey; })).map(function (xs) { return { customerKey: xs[0].customerKey, negative: xs.some(isNeg) }; });
    var latest = {}; F0.filter(inF).slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; }).forEach(function (v) { latest[v.answerKey] = v; });
    var votes = Object.values(latest), down = votes.filter(function (v) { return v.vote === 'down'; });
    var byDay = by(E, function (e) { return e.at.slice(0, 10); }), byInq = by(E, function (e) { return e.inquiry; }), byAbout = by(neg, function (e) { return e.about; }), byAfter = by(E, function (e) { return e.after; });
    return {
      kpis: { conversations: shown(convs) ? convs.length : null, turns: n(E), negativeConversationShare: share(convs.filter(function (c) { return c.negative; }), convs),
        thumbsDownShare: share(down, votes), votes: n(votes) },
      daily: datesBetween(f.from, f.to).map(function (date) { var xs = byDay[date] || [];
        return { date: date, turns: n(xs), positive: share(xs.filter(function (e) { return e.sentiment === 'positive'; }), xs), neutral: share(xs.filter(function (e) { return e.sentiment === 'neutral'; }), xs), negative: share(xs.filter(isNeg), xs) }; }),
      mix: Object.keys(SENTIMENT_LABEL).map(function (s) { var xs = E.filter(function (e) { return e.sentiment === s; }); return { sentiment: s, turns: n(xs), share: share(xs, E) }; }),
      byInquiry: Object.keys(byInq).map(function (key) { var xs = byInq[key]; return { key: key, turns: n(xs), negativeShare: share(xs.filter(isNeg), xs) }; })
        .sort(function (a, b) { return ((b.negativeShare === null ? -1 : b.negativeShare) - (a.negativeShare === null ? -1 : a.negativeShare)) || ((b.turns || 0) - (a.turns || 0)); }),
      about: Object.keys(ABOUT_LABEL).map(function (a) { var xs = byAbout[a] || []; return { about: a, turns: n(xs), share: share(xs, neg) }; }),
      after: Object.keys(AFTER_LABEL).map(function (a) { var xs = byAfter[a] || [], ng = xs.filter(isNeg); return { after: a, negative: n(ng), negativeShare: share(ng, xs) }; }),
      reasons: Object.keys(REASON_LABEL).map(function (r) { return { reason: r, votes: n(down.filter(function (v) { return v.reason === r; })) }; })
    };
  }

  /* Bar rows with one ink series: label, bar, count, mono share. */
  function shareRows(rows, cols) {
    var top = Math.max.apply(null, rows.map(function (r) { return r.share || 0; })) || 1;
    return '<div class="fn">' + rows.map(function (r) {
      return '<div class="fn-row" style="grid-template-columns:' + (cols || 'minmax(110px,160px) minmax(0,1fr) 64px 44px') + '"><span class="lb" title="' + esc(r.label) + '">' + r.label + '</span><span class="tr" aria-hidden="true"><i style="--w:' + ((r.share || 0) / top * 100).toFixed(1) + '%"></i></span>' +
        '<span class="ct">' + fmtCount(r.count) + '</span><span class="pc">' + (r.share === null ? '' : pct(r.share)) + '</span></div>';
    }).join('') + '</div>';
  }

  function renderSentiment() {

    if (ROLE !== 'admin') return '<div class="pg-head"><div><h2>Sentiment</h2><p>Only admins can see how customers feel across chats. Switch to Admin below to view it.</p></div></div>';
    var f = UI.sentiment;
    var seg = function (key, opts) { return '<div class="seg" role="group" aria-label="' + key + '">' + opts.map(function (o) { return '<button type="button" data-act="sf" data-k="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (String(f[key]) === String(o[0])) + '">' + o[1] + '</button>'; }).join('') + '</div>'; };
    return '<div class="pg-head"><div><h2>Sentiment</h2><p>How customers feel in their messages, labelled by Jev, and what came before the unhappy ones. Labels only: no message text is kept here, and groups under ' + param('analytics-min') + ' customers are hidden.</p></div>' +
      '<span class="pill">' + ic('flask-conical') + 'Pilot traffic · mock data</span></div>' +
      '<div class="filters">' + seg('range', [[7, '7 days'], [30, '30 days'], [90, '90 days']]) + seg('track', [['all', 'All'], ['personal', 'Individuals'], ['business', 'Business']]) +
        seg('entry', [['all', 'All entry points'], ['web', 'Web'], ['smartMobile', 'Smart Mobile']]) + '</div>' +

  function sentimentBody() {
    if (!SN) SN = buildSentiment();
    var f = UI.sentiment, to = addDays(TODAY, -1), from = addDays(TODAY, -f.range);
    var s = summarizeSentiment(SN.events, SN.feedback, { from: from, to: to, track: f.track === 'all' ? null : f.track, entry: f.entry === 'all' ? null : f.entry, minCount: param('analytics-min') });
    var k = s.kpis, confused = s.mix.filter(function (m) { return m.sentiment === 'confused'; })[0];
    var html = '<div class="kpis" style="--n:4">' +

      kpi('Confused', fmtShare(confused.share), 'of customer messages') +

    var nice = Math.ceil(max * 20) / 20, ticks = [nice, nice / 2, 0];
    html += '<section class="gcard sec" aria-labelledby="sn-vol-h"><div class="gc-h"><span id="sn-vol-h">Unhappy messages per day</span><span class="an-from">Share of customer messages · ' + date(from) + ' – ' + date(to) + '</span></div><div class="gc-b">' +
      '<div class="vol"><div class="vol-y" aria-hidden="true">' + ticks.map(function (t) { return '<span style="top:' + (100 - t / nice * 100) + '%">' + pct(t) + '</span>'; }).join('') + '</div>' +
      '<div class="vol-plot" id="sn-plot"><span class="gl" style="top:0"></span><span class="gl" style="top:50%"></span><span class="gl" style="bottom:0"></span>' +
      '<div class="vol-bars" id="sn-bars" role="img" aria-label="Share of unhappy customer messages per day, up to ' + pct(max) + '. The data table below has every day.">' +
      s.daily.map(function (d, i) { return '<b data-i="' + i + '"><i style="--h:' + ((d.negative || 0) / nice * 100).toFixed(1) + '%"></i></b>'; }).join('') + '</div>' +
      '<div class="tip" id="sn-tip" hidden></div></div>' +
      '<div class="vol-x" aria-hidden="true"><span>' + dateShort(from) + '</span><span>' + dateShort(s.daily[Math.floor(s.daily.length / 2)].date) + '</span><span>' + dateShort(to) + '</span></div></div></div>' +
      '<details class="tv"><summary>' + ic('chevron-right') + 'Data table</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th class="r">Messages</th><th class="r">Positive</th><th class="r">Neutral</th><th class="r">Unhappy</th></tr></thead><tbody>' +
      s.daily.slice().reverse().map(function (d) { return '<tr><td class="mono" style="font-size:12px">' + date(d.date) + '</td><td class="r mono">' + fmtCount(d.turns) + '</td><td class="r mono">' + fmtShare(d.positive) + '</td><td class="r mono">' + fmtShare(d.neutral) + '</td><td class="r mono">' + fmtShare(d.negative) + '</td></tr>'; }).join('') +
      '</tbody></table></div></details></section>';
    SN.lastDaily = s.daily;

    html += '<div class="an-grid sec">';
    html += card('How customers feel', 'Share of customer messages', shareRows(s.mix.map(function (m) { return { label: SENTIMENT_LABEL[m.sentiment], count: m.turns, share: m.share }; })));
    html += card('What unhappy messages were about', 'Share of unhappy messages', shareRows(s.about.map(function (a) { return { label: ABOUT_LABEL[a.about], count: a.turns, share: a.share }; })));
    html += '</div>';

  document.addEventListener('input', function (ev) {

    if (ev.target.id === 'uq') { UI.users.q = ev.target.value; render(); var q = $('uq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  });
  /* Unsaved user edits: the browser asks before leaving */
  window.addEventListener('beforeunload', function (ev) { if (Object.keys(UI.users.pending).length) { ev.preventDefault(); ev.returnValue = ''; } });

  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('[data-pform]'); if (!form) return;
    ev.preventDefault();
    var e = entity('parameters', form.dataset.pform), cur = current(e).data;
    var v = parseFloat($('pv').value), src = $('ps').value.trim(), rb = $('pr').value, note = $('pn').value.trim(), err = [];
    if (isNaN(v) || v < 0) err.push('Enter a value of 0 or more.');
    if (!validUrl(src)) err.push('Add a source link.');
    if (!(rb > TODAY)) err.push('Pick a review date after today.');
    if (!err.length && v === cur.value && src === cur.sourceUrl && rb === cur.reviewBy) err.push('Nothing changed.');
    if (err.length) { var pe = $('perr'); pe.innerHTML = ic('circle-alert') + esc(err.join(' ')); pe.hidden = false; pe.setAttribute('role', 'alert'); icons(); return; }
    var r = commit(e, Object.assign({}, cur, { value: v, sourceUrl: src, reviewBy: rb, validFrom: TODAY }), { validFrom: TODAY, note: note });
    UI.paramOpen = null;
    toast(isAdmin() ? 'Published ' + e.name + ': ' + fmtParam(r.version.data) : 'Sent ' + e.name + ' for approval', isAdmin() ? 'Answers that were blocked by it can run again.' : 'Switch to Admin in the sidebar to approve it.');
    render();
  });

  window.addEventListener('hashchange', navigate);
  navigate();
})();
/* Phones show table rows as cards (§12), so each cell carries its column header as data-label */
(function () {
  var queued = false;
  function labelCells() {
    queued = false;
    document.querySelectorAll('table.tbl').forEach(function (t) {
      var heads = [].map.call(t.querySelectorAll('thead th'), function (th) { return th.querySelector('.sr-only') ? '' : th.textContent.trim(); });
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        [].forEach.call(tr.children, function (td, i) { if (heads[i] && !td.hasAttribute('data-label')) td.setAttribute('data-label', heads[i]); });
      });
    });
  }
  labelCells();
  new MutationObserver(function () { if (!queued) { queued = true; requestAnimationFrame(labelCells); } }).observe(document.body, { childList: true, subtree: true });
})();
