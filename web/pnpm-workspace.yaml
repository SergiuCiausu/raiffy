allowBuilds:
  # Only the Convex CLI bundles with esbuild, and it runs from the repo root; the web app needs just the client
  esbuild: false
  sharp: false
  unrs-resolver: false

# Slow shared network at the venue: large native binaries (Next's SWC, ~32 MB) need minutes, not the 60 s default
fetchTimeout: 1800000
fetchRetries: 6
networkConcurrency: 4
