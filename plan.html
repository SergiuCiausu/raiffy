<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your plan · Raiffy</title>
<meta name="description" content="Concept page for a Raiffy financial plan: an indicative simulation laid out like the bank's standard information form, with the repayment schedule, every fee and the hand-off to Smart Mobile.">
<!--
  Raiffy: the full financial plan (route /plan/[id] at conversion). Front end only: the plan comes from chat.html through
  localStorage (raiffy.demo.plans) or, without a saved plan, from the example in the MOCK DATA block. Nothing leaves the page.
  Layout follows the SECCI order: label, goal, routes, main features, all commissions, affordability, schedule,
  assumptions and gaps, sources, next steps. The PDF is the browser's print, with its own stylesheet.
  Mode: Daylight. Accent as light only; ink for the primary action. Tokens and class names match chat.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-sans: "Geist", "Instrument Sans", "Inter Tight", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --text-body: 15px; --lh-body: 1.6; --text-sm: 14px; --text-xs: 13px; --text-eyebrow: 11px; --text-micro: 12px;
  --radius-btn: 10px; --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-panel: 14px; --radius-pill: 999px;
  --accent-a: #FFD23F; --accent-b: #FF9A3D; --ink: #1A1A1A;
  --halo: 0 0 0 4px rgba(255,210,63,.35);
  --bg: #FAF9F7; --surface: #FFFFFF; --surface-2: #F4F3F0; --surface-3: #FBFAF8; --surface-warm: #FBFAF6;
  --border: rgba(20,20,20,.07); --border-strong: rgba(20,20,20,.12); --border-hover: rgba(20,20,20,.24);
  --text-1: #1A1A1A; --text-2: #5C5C5F; --text-3: #8E8E93;
  --on-ink: #fff; --ink-hover: #2A2A2A; --track: #E9E6DE; --off: #D9D5CB;
  --tint-rec: #FFF3C4; --tint-rec-card: #FFFDF5; --tint-hl: #FFF8DC;
  --amber-ink: #7A5A00; --amber-ink-2: #6B5200;
  --ok-bg: #F1F8F3; --ok-ink: #1E5B37; --ok: #2E7D4F;
  --rec-line: rgba(200,150,20,.3); --rec-line-mid: rgba(200,150,20,.35);
  --mark-ring: 0 0 0 1px rgba(0,0,0,.08) inset;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font-sans); font-size: var(--text-body); line-height: var(--lh-body); color: var(--text-1); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, textarea { font: inherit; color: inherit; }
ul { margin: 0; }
.mono { font-family: var(--font-mono); }
.micro { font-size: var(--text-micro); color: var(--text-2); }
.eyebrow { font-size: var(--text-eyebrow); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.skip { position: absolute; left: 16px; top: -48px; z-index: 10; padding: 8px 12px; border-radius: var(--radius-btn); background: var(--ink); color: var(--on-ink); text-decoration: none; font-size: var(--text-xs); }
.skip:focus { top: 12px; }
.print-only { display: none; }

/* Buttons: same as chat.html */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-btn);
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; font: 500 var(--text-xs)/1 var(--font-sans);
  transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-dark { background: var(--ink); color: var(--on-ink); }
.btn-ghost { background: var(--surface); color: var(--text-1); border-color: var(--border-strong); }
.btn-dark:active { background: var(--ink-hover); }
.btn-ghost:active { background: var(--surface-2); }
.btn-sm { height: 32px; padding: 0 12px; }
.link { padding: 0; border: 0; background: none; cursor: pointer; font-size: var(--text-xs); color: var(--text-1); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
@media (hover: hover) and (pointer: fine) {
  .btn-dark:hover { background: var(--ink-hover); }
  .btn-ghost:hover { border-color: var(--border-hover); }
  .link:hover { text-decoration-color: var(--text-1); }
}
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-pill); font-size: var(--text-eyebrow); font-weight: 500;
  color: var(--c, var(--text-2)); background: color-mix(in srgb, var(--c, var(--text-2)) 12%, transparent); white-space: nowrap; }
.rec-badge { display: inline-flex; align-items: center; gap: 4px; width: fit-content; height: 20px; padding: 0 8px; border-radius: var(--radius-pill); background: var(--tint-rec); color: var(--ink);
  font-size: var(--text-eyebrow); font-weight: 600; }
.rec-badge svg { width: 12px; height: 12px; stroke-width: 2.4; }

/* Top bar */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: -.01em; border-radius: var(--radius-sm); }
.logo-mark { width: 24px; height: 24px; border-radius: var(--radius-md); background: var(--accent-a); display: grid; place-items: center; box-shadow: var(--mark-ring); }
.logo-mark svg { width: 14px; height: 14px; color: var(--ink); stroke-width: 2.2; }
.bar-t { font-size: var(--text-xs); color: var(--text-2); }
.bar-acts { margin-left: auto; display: flex; gap: 8px; }
@media (max-width: 560px) { .bar-acts .lbl { display: none; } .bar-acts .btn { width: 32px; padding: 0; } }

/* Document */
.page { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; display: grid; gap: 28px; }
.page:focus { outline: none; }
@media (max-width: 640px) { .page { padding: 24px 16px 48px; gap: 24px; } }
.doc-head { display: grid; gap: 12px; }
.doc-head h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; }
@media (max-width: 640px) { .doc-head h1 { font-size: 24px; } }
.route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--text-sm); }
section { display: grid; gap: 12px; align-content: start; }
section > h2 { font-size: 18px; letter-spacing: -.01em; }
.sec-lead { font-size: var(--text-xs); color: var(--text-2); }
.plan-label { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-radius: var(--radius-btn); background: var(--tint-hl);
  box-shadow: inset 0 0 0 1px var(--rec-line); font-size: var(--text-xs); line-height: 1.5; color: var(--amber-ink-2); }
.plan-label svg { width: 16px; height: 16px; margin-top: 1px; }
.plan-label b { font-weight: 600; }

/* Check status, same as chat.html */
.vstat { display: flex; align-items: flex-start; gap: 8px; padding: 9px 12px; border-radius: var(--radius-btn); font-size: var(--text-xs); line-height: 1.45; background: var(--surface-2); color: var(--text-2); }
.vstat svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.vstat b { color: var(--text-1); font-weight: 500; }
.vstat.ok { background: var(--ok-bg); color: var(--ok-ink); }
.vstat.ok b { color: var(--ok-ink); }
.vstat.ok svg { color: var(--ok); }
.vstat.changed { background: var(--tint-hl); color: var(--amber-ink-2); }

/* Routes: options side by side, the recommended one lit */
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 680px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: grid; gap: 8px; align-content: start; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface); }
.opt.rec { border-color: var(--rec-line-mid); background: var(--tint-rec-card); }
.opt.na { opacity: .6; }
.opt-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
.opt-h { display: grid; gap: 2px; font-size: var(--text-xs); font-weight: 600; }
.opt-h .micro { font-weight: 400; color: var(--text-1); }
.big { font: 600 20px/1.1 var(--font-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: var(--text-micro); font-weight: 400; color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: var(--text-xs); color: var(--text-2); }
.kv b { flex: none; white-space: nowrap; color: var(--text-1); font: 500 var(--text-xs) var(--font-mono); font-variant-numeric: tabular-nums; }
.opt-note { font-size: var(--text-xs); color: var(--text-2); line-height: 1.45; }
.rec-why { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-panel); background: var(--surface-warm); }
.rec-why-h { display: flex; align-items: center; gap: 10px; font-size: var(--text-xs); font-weight: 600; }
.ava-raiffy { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--accent-a); }
.ava-raiffy svg { width: 12px; height: 12px; stroke-width: 2.2; }
.rec-why ul { list-style: none; padding: 0 0 0 32px; display: grid; gap: 6px; font-size: var(--text-xs); line-height: 1.5; }
.rec-why li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
.rec-why li svg { width: 14px; height: 14px; margin-top: 4px; color: var(--text-2); stroke-width: 2.4; }
.rec-alt { padding-left: 32px; font-size: var(--text-xs); color: var(--text-2); line-height: 1.5; }

/* Main features (SECCI order), every figure with its source */
.doc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius-btn); background: var(--surface); }
.doc-grid > div { display: grid; gap: 2px; align-content: start; min-width: 0; padding: 12px 14px; border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
.doc-grid > div:nth-child(3n+1) { border-left: 0; }
.doc-grid > div:nth-child(-n+3) { border-top: 0; }
.doc-grid span, .doc-grid small { font-size: var(--text-micro); color: var(--text-2); }
.doc-grid b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .doc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .doc-grid > div { border-left: 0; border-top: 1px solid var(--border); }
  .doc-grid > div:nth-child(2n) { border-left: 1px solid var(--border); }
  .doc-grid > div:nth-child(-n+2) { border-top: 0; }
}

/* Lists of lines: commissions, sources */
.lines { display: grid; border: 1px solid var(--border); border-radius: var(--radius-btn); background: var(--surface); }
.ln { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: var(--text-xs); }
.ln:first-child { border-top: 0; }
.ln small { display: block; font-size: var(--text-xs); color: var(--text-2); line-height: 1.45; }
.ln .amt { font: 500 var(--text-xs) var(--font-mono); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ln .amt small { font-family: var(--font-sans); }
.ln.src-ln { grid-template-columns: 16px minmax(0, 1fr); gap: 10px; }
.ln.src-ln svg { width: 14px; height: 14px; margin-top: 3px; color: var(--text-2); }

/* Affordability */
.afford { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-btn); background: var(--surface); }
.afford-bar { display: flex; height: 10px; border-radius: var(--radius-xs); overflow: hidden; background: var(--surface-2); }
.afford-bar i { display: block; height: 100%; }
.afford-bar .ob { background: var(--off); }
.afford-bar .pm { background: var(--ink); }
.afford-key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--text-xs); color: var(--text-2); }
.afford-key span { display: inline-flex; align-items: center; gap: 6px; }
.afford-key i { width: 10px; height: 10px; border-radius: 2px; }
.afford-key b { color: var(--text-1); font: 500 var(--text-xs) var(--font-mono); }

/* Balance over time and the schedule */
.bal { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-btn); background: var(--surface); }
.bal-bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
.bal-bars i { flex: 1; min-width: 1px; border-radius: var(--radius-xs) var(--radius-xs) 0 0; background: var(--track); }
.bal-bars i:first-child { background: var(--ink); }
.bal-cap { display: flex; justify-content: space-between; gap: 8px; font: 400 var(--text-micro) var(--font-mono); color: var(--text-1); }
.tbl-wrap { border: 1px solid var(--border); border-radius: var(--radius-btn); background: var(--surface); overflow: hidden; }
.sched { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sched th, .sched td { padding: 8px 12px; text-align: right; white-space: nowrap; border-top: 1px solid var(--border); }
.sched th { border-top: 0; font: 500 var(--text-micro) var(--font-sans); color: var(--text-2); }
.sched td { font: 400 var(--text-micro) var(--font-mono); }
.sched th:first-child, .sched td:first-child { text-align: left; }
.sched tfoot td { font-weight: 500; background: var(--surface-3); }
.sched .more { display: none; }
.sched.all .more { display: table-row; }
@media (max-width: 560px) { .sched .hide-sm { display: none; } .sched th, .sched td { padding: 8px 10px; } }

.bul { padding-left: 18px; display: grid; gap: 6px; font-size: var(--text-sm); color: var(--text-1); }
.bul li::marker { color: var(--text-3); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 640px) { .cols { grid-template-columns: minmax(0, 1fr); } }

/* Next steps */
.next-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.note { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; font-size: var(--text-xs); line-height: 1.5; color: var(--text-2); }
.note svg { width: 14px; height: 14px; margin-top: 2px; color: var(--text-1); }
.demo-out { padding: 12px 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-btn); font-size: var(--text-xs); line-height: 1.5; color: var(--text-2); }
.demo-out b { color: var(--text-1); font-weight: 500; }
.vreq { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-panel); background: var(--surface); }
.vreq h3 { font-size: var(--text-sm); }
.vreq p, .vreq details { font-size: var(--text-xs); color: var(--text-2); line-height: 1.5; }
.vreq summary { cursor: pointer; width: fit-content; color: var(--text-1); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.vreq ul { margin-top: 8px; padding-left: 18px; display: grid; gap: 4px; }
.vreq textarea { width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-btn); resize: vertical; outline: none; font-size: var(--text-sm); line-height: 1.5; background: var(--surface); }
.vreq textarea:focus { border-color: var(--ink); box-shadow: var(--halo); }
.vreq .row { display: flex; flex-wrap: wrap; gap: 8px; }
.foot { padding-top: 16px; border-top: 1px solid var(--border); font-size: var(--text-xs); color: var(--text-2); line-height: 1.5; }
.empty { display: grid; gap: 12px; justify-items: start; padding: 48px 0; }
.empty h1 { font-size: 24px; letter-spacing: -.02em; }
.empty p { color: var(--text-2); font-size: var(--text-sm); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* The PDF: the browser's print. Everything that acts is dropped, the whole schedule is shown. */
@media print {
  @page { margin: 16mm 14mm; }
  body { background: var(--surface); font-size: 11pt; }
  .bar, .skip, .no-print, .vreq, .demo-out { display: none !important; }
  .print-only { display: block; }
  .page { max-width: none; padding: 0; gap: 18px; }
  .sched .more { display: table-row; }
  .sched .hide-sm { display: table-cell; }
  .opts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .doc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  section, .opt, .ln, .doc-grid, .rec-why, .afford { break-inside: avoid; }
  .sched-sec, .sched-sec .tbl-wrap { break-inside: auto; }
  .sched tr { break-inside: avoid; }
  .plan-label, .opt.rec, .rec-badge, .vstat, .bal-bars i, .afford-bar i { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* §12-touch:start */
/* ── §12 Mobile: touch layer. The same core sits in every prototype, keep the copies identical; page parts follow it ── */
@media (pointer: coarse) {
  /* Every control reaches a 44×44 hit area through ::before, while the drawn box keeps its size */
  :where(button, [role="button"], [role="tab"], [role="switch"], a.btn, a.qbtn, a.chip, a.src, a.logo, a.back, a.link, a.t-main, summary, label.check) { position: relative; }
  :where(button, [role="button"], [role="tab"], [role="switch"], a.btn, a.qbtn, a.chip, a.src, a.logo, a.back, a.link, a.t-main, summary, label.check)::before {
    content: ""; position: absolute; inset: min(0px, calc((100% - 44px) / 2)); }
  /* Text fields at 16px so iOS doesn't zoom, 44px tall; sliders get a 44px box around the 4px track */
  :is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="hidden"]), select, textarea) { font-size: 16px; }
  :is(input:not([type="checkbox"], [type="radio"], [type="range"], [type="hidden"]), select) { min-height: 44px; }
  input[type="range"] { height: 44px; }
}
@media (pointer: coarse) {
  .bar-acts .btn { width: 36px; height: 36px; }
}
/* §12-touch:end */
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the plan</a>
<header class="bar">
  <a class="logo" href="raiffy.html"><span class="logo-mark"><i data-lucide="compass"></i></span>Raiffy</a>
  <span class="bar-t">Plan</span>
  <div class="bar-acts">
    <a class="btn btn-ghost btn-sm" href="chat.html" aria-label="Back to the chat"><i data-lucide="arrow-left"></i><span class="lbl">Back to the chat</span></a>
    <button type="button" class="btn btn-ghost btn-sm" data-act="print" aria-label="Download PDF"><i data-lucide="download"></i><span class="lbl">Download PDF</span></button>
  </div>
</header>
<main id="main" class="page" tabindex="-1"></main>
<div id="announce" class="sr-only" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function icons() { if (window.lucide) lucide.createIcons(); }
  function ic(n) { return '<i data-lucide="' + n + '"></i>'; }
  // Plans come from storage another page wrote, so every text goes through esc() before it reaches markup
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
  function group(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function lei2(bani) { var s = (Math.abs(num(bani)) / 100).toFixed(2).split('.'); return (bani < 0 ? '−' : '') + group(s[0]) + '.' + s[1] + ' lei'; }
  function lei0(bani) { return group(String(Math.round(num(bani) / 100))) + ' lei'; }
  function money(bani) { return group((num(bani) / 100).toFixed(2).split('.')[0]) + '.' + (num(bani) / 100).toFixed(2).split('.')[1]; }
  function pctBps(bps) { return (bps / 100).toFixed(bps % 10 ? 2 : 1) + '%'; }
  function dateLong(iso) { var x = new Date(String(iso).slice(0, 10) + 'T12:00'); return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + x.getFullYear(); }
  function dateShort(iso) { var x = new Date(String(iso).slice(0, 10) + 'T12:00'); return x.getDate() + ' ' + MONTHS[x.getMonth()] + ' ' + String(x.getFullYear()).slice(2); }
  function monthYear(iso) { var x = new Date(String(iso).slice(0, 10) + 'T12:00'); return MONTHS[x.getMonth()] + ' ' + x.getFullYear(); }
  function announce(msg) { var a = $('announce'); a.textContent = ''; setTimeout(function () { a.textContent = msg; }, 60); }

  /* Repayment schedule: mirrors lib/calc/schedule.ts repaymentSchedule (and chat.html) exactly. */
  function addMonthsISO(iso, k) {
    var p = iso.split('-').map(Number), t = new Date(Date.UTC(p[0], p[1] - 1 + k, 1));
    t.setUTCDate(Math.min(p[2], new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate()));
    return t.toISOString().slice(0, 10);
  }
  function annualPercentageRate(net, pays) {
    function pv(x) { var s = 0; for (var i = 0; i < pays.length; i++) s += pays[i] / Math.pow(1 + x, (i + 1) / 12); return s; }
    var lo = 0, hi = 10;
    if (pv(lo) <= net) return 0;
    for (var i = 0; i < 200 && hi - lo > 1e-12; i++) { var mid = (lo + hi) / 2; if (pv(mid) > net) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  function repaymentSchedule(x) {
    var r = x.annualRateBps / 10000 / 12, inst = Math.round(r ? x.principal * r / (1 - Math.pow(1 + r, -x.months)) : x.principal / x.months), rows = [], bal = x.principal;
    for (var n = 1; n <= x.months; n++) {
      var it = Math.round(bal * r), pr = n === x.months ? bal : Math.min(bal, inst - it);
      bal -= pr;
      rows.push({ n: n, date: addMonthsISO(x.firstPaymentDate, n - 1), principal: pr, interest: it, fees: x.monthlyFee, payment: pr + it + x.monthlyFee, balance: bal });
    }
    var interest = rows.reduce(function (s, w) { return s + w.interest; }, 0), fees = x.upfrontFee + x.monthlyFee * x.months;
    return { instalment: inst, monthly: inst + x.monthlyFee, rows: rows, totals: { principal: x.principal, interest: interest, fees: fees, payable: x.principal + interest + fees },
      dae: annualPercentageRate(x.principal - x.upfrontFee, rows.map(function (w) { return w.payment; })) };
  }

      '<div class="doc-head"><span class="eyebrow">Plan ' + esc(p.id) + ' · version ' + num(p.version) + ' · ' + dateLong(p.createdAt) + ', ' + esc(String(p.createdAt).slice(11, 16)) + (p.example ? ' · example' : '') + '</span>' +
      '<h1>' + esc(g.summary) + '</h1>' +
      '<p class="route-line">' + esc(g.chosenRoute) + ' · ' + lei0(g.amount) + ' over ' + g.termMonths + ' months' + (recd ? '<span class="rec-badge">' + ic('sparkles') + 'Recommended</span>' : '<span class="pill">Your choice</span>') + '</p>' +
      '<p class="plan-label">' + ic('info') + '<span><b>Indicative simulation: not a firm credit offer.</b> Raiffy made it from your conversation. The bank issues the official offer (SECCI), the contract and the schedule that counts when you apply in Smart Mobile.</span></p>' +
      statusHTML(p.verification) + '</div>' +
      routesHTML(p) + featuresHTML(p) + commissionsHTML(p) + affordHTML(p) + scheduleHTML(p) + listsHTML(p) + nextHTML(p) +
      '<p class="foot">Made with AI by Raiffy from your conversation. A specialist’s check confirms the information, not a credit decision. Concept demo: figures are illustrative.' +
      '<span class="print-only">Printed ' + dateLong(new Date().toISOString()) + ' · Plan ' + esc(p.id) + ', version ' + num(p.version) + '</span></p>';
    icons();
  }

  /* ───────────── Events ───────────── */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act;
    if (a === 'print') { ui.allRows = true; render(); window.print(); return; }
    if (a === 'rows') { ui.allRows = !ui.allRows; render(); var r = main.querySelector('[data-act="rows"]'); if (r) r.focus(); return; }
    if (a === 'apply') { ui.applied = !ui.applied; render(); main.querySelector('[data-act="apply"]').focus(); return; }
    if (a === 'inbox') { ui.inboxed = true; render(); announce('Sent to your Smart Mobile Inbox. Demo: nothing is sent.'); return; }
    if (a === 'ask') { ui.asking = true; render(); $('vnote').focus(); return; }
    if (a === 'cancel') { ui.asking = false; render(); var k = main.querySelector('[data-act="ask"]'); if (k) k.focus(); return; }
    if (a === 'send') { sendCheck($('vnote').value.trim()); return; }
  });
  window.addEventListener('hashchange', function () { plan = null; ui = { allRows: false, asking: false, applied: false, inboxed: false }; render(); main.focus(); });
  window.addEventListener('afterprint', function () { ui.allRows = false; render(); });
  // The chat and the console change the saved plan and its check in other tabs
  window.addEventListener('storage', function (e) {
    if (!plan) return;
    if (e.key === VER_KEY) { if (applyVerdict()) { render(); announce('A specialist replied about your plan.'); } return; }
    if (e.key === PLAN_KEY && !plan.example) {
      var fresh = readJSON(PLAN_KEY, {})[plan.id];
      if (valid(fresh) && JSON.stringify(fresh) !== JSON.stringify(plan)) { plan = fresh; render(); }
    }
  });

  plan = load();
  if (plan) applyVerdict();
  render();
})();
</script>
</body>
</html>
