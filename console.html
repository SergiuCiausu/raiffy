<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Console · Raiffy</title>
<meta name="description" content="Concept operator console for Raiffy: review flagged answers, plans and counter-offers, and edit products and parameters with approval.">
<!--
  Raiffy: operator and admin console (docs/shared/console.md). Front end only: roles, saving and approvals are simulated. Nothing leaves the page.
  Mode: Daylight only. Ink #1A1A1A for selection; accent as light (highlighted rows, halos, added text in diffs). --danger only for failing checks.
  Routes: #reviews · #reviews/<id> · #products · #products/<id> · #parameters · #approvals · #approvals/<id> · #audit
  Demo bridge: requests sent from chat.html ("Ask a specialist", "Check my plan") arrive here through localStorage, and decisions go back the same way.
  Mock data lives in one block (MOCK DATA) in the spec's shapes, so it can move to Convex unchanged.
  Calculations (annuity, DAE, impact preview) mirror the deterministic tools in lib/ and move there at conversion.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───────────── Tokens (shared with raiffy.html and chat.html) ───────────── */
:root {
  --font-sans: "Geist", "Instrument Sans", "Inter Tight", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
  --text-body: 15px; --text-sm: 14px; --text-xs: 13px;
  --radius-card: 20px; --radius-btn: 10px;
  --accent-a: #FFD23F; --accent-b: #FF9A3D;
  --ink: #1A1A1A;
  --halo: 0 0 0 4px rgba(255,210,63,.35);
  --danger: #B42318;     /* failing checks and errors only */
  --ok: #2E7D4F;         /* checks only */
  --bg: #FAF9F7; --surface: #FFFFFF; --surface-2: #F4F3F0;
  --border: rgba(20,20,20,.07); --border-strong: rgba(20,20,20,.12);
  --text-1: #1A1A1A; --text-2: #5C5C5F; --text-3: #8E8E93;
  --shadow-card: 0 1px 2px rgba(0,0,0,.04); --shadow-float: 0 8px 30px rgba(20,20,40,.08);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font-sans); font-size: var(--text-body); line-height: 1.6; color: var(--text-1); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.micro { font-size: 11px; color: var(--text-3); }
.muted { color: var(--text-3); }
.eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; text-decoration: none; }
.skip:focus { top: 12px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-btn);
  border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; font: 500 var(--text-xs)/1 var(--font-sans);
  transition: transform 160ms var(--ease-out), background-color 150ms ease, border-color 150ms ease, color 150ms ease; }
.btn svg { width: 15px; height: 15px; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-ghost { background: var(--surface); color: var(--text-1); border-color: var(--border-strong); }
.btn:disabled { cursor: default; }
.btn-dark:disabled { background: #D9D5CB; color: #fff; }
.btn-ghost:disabled { color: var(--text-3); }
.btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; }
.btn-xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.icon-btn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent;
  color: var(--text-2); cursor: pointer; transition: color 150ms ease, background-color 150ms ease, transform 160ms var(--ease-out); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:active { transform: scale(.94); }
.link { border: 0; padding: 0; background: none; cursor: pointer; font-size: 12.5px; color: var(--text-1); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
@media (hover: hover) and (pointer: fine) {
  .btn-dark:hover:not(:disabled) { background: #2A2A2A; }
  .btn-ghost:hover:not(:disabled) { border-color: rgba(20,20,20,.24); }
  .icon-btn:hover { color: var(--text-1); background: rgba(20,20,20,.05); }
  .link:hover { text-decoration-color: var(--ink); }
}

.ava-raiffy { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--accent-a); }
.ava-raiffy svg { width: 11px; height: 11px; stroke-width: 2.2; }
.ava { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 600;
  background: linear-gradient(135deg, #E9D8B4, #C9A86A); color: #4A3610; }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 500;
  color: var(--c, #5C5C5F); background: color-mix(in srgb, var(--c, #5C5C5F) 12%, transparent); white-space: nowrap; }
.pill svg { width: 11px; height: 11px; }
.pill.amber { --c: #8A6A00; background: #FFF3C4; }
.pill.ink { --c: #1A1A1A; }
.pill.ok { --c: #2E7D4F; }
.pill.bad { --c: #B42318; }
.pill.line { background: transparent; box-shadow: inset 0 0 0 1px var(--border-strong); --c: #5C5C5F; }

/* ───────────── App shell ───────────── */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { display: flex; flex-direction: column; min-height: 0; padding: 14px 12px 12px; background: var(--surface-2); border-right: 1px solid var(--border); }
.logo { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: -.01em; border-radius: 6px; }
.logo small { font-weight: 400; font-size: 12px; color: var(--text-3); }
.logo-mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-a); display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,.08) inset; }
.logo-mark svg { width: 14px; height: 14px; color: #1A1A1A; stroke-width: 2.2; }
.nav { flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px; display: grid; align-content: start; gap: 2px; }
.nav .grp { padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 13.5px; color: var(--text-2);
  transition: background-color 150ms ease, color 150ms ease; }
.nav a svg { width: 15px; height: 15px; color: var(--text-3); flex: none; }
.nav a span { flex: 1; }
.nav a small { font: 500 11px var(--font-mono); color: var(--text-3); }
.nav a small.due { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 10.5px; }
.nav a[aria-current="page"] { background: var(--surface); color: var(--text-1); box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 0 0 1px var(--border); }
.nav a[aria-current="page"] svg { color: var(--text-1); }
.nav .later { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; font-size: 12.5px; color: var(--text-3); }
.nav .later svg { width: 14px; height: 14px; }
@media (hover: hover) and (pointer: fine) { .nav a:not([aria-current="page"]):hover { background: rgba(20,20,20,.04); color: var(--text-1); } }
.me { display: grid; gap: 10px; padding: 12px 6px 0; border-top: 1px solid var(--border); }
.me-row { display: flex; align-items: center; gap: 10px; }
.me-row div { flex: 1; min-width: 0; line-height: 1.3; }
.me-row b { display: block; font-size: 13px; font-weight: 500; }
.me-row small { font-size: 11.5px; color: var(--text-3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; border-radius: 9px; background: rgba(20,20,20,.05); }
.seg button { height: 28px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-size: 12px; color: var(--text-2); transition: background-color 150ms ease, color 150ms ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.demo-note { font-size: 10.5px; color: var(--text-3); line-height: 1.4; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { flex: none; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
.top .menu { display: none; margin-left: -8px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.crumbs a { text-decoration: none; color: var(--text-3); }
@media (hover: hover) and (pointer: fine) { .crumbs a:hover { color: var(--text-1); } }
.crumbs svg { width: 13px; height: 13px; flex: none; }
.crumbs b { color: var(--text-1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.scroll:focus { outline: none; }
.page { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head h1 { font-size: 24px; line-height: 1.15; letter-spacing: -.03em; }
.page-head p { margin-top: 6px; font-size: 14px; color: var(--text-2); max-width: 64ch; }

/* Chips (filters) */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface);
  cursor: pointer; font-size: 12px; color: var(--text-2); transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease; }
.qbtn small { font: 500 10.5px var(--font-mono); color: var(--text-3); }
.qbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.qbtn[aria-pressed="true"] small { color: rgba(255,255,255,.6); }
@media (hover: hover) and (pointer: fine) { .qbtn:not([aria-pressed="true"]):hover { border-color: rgba(20,20,20,.24); color: var(--text-1); } }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 8px; height: 32px; width: 240px; max-width: 100%; padding: 0 10px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); }
.search:focus-within { border-color: var(--ink); box-shadow: var(--halo); }
.search svg { width: 14px; height: 14px; color: var(--text-3); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 13px; }

/* Cards and tables */
.card { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.card-h h2, .card-h h3 { font-size: 13.5px; letter-spacing: -.005em; display: inline-flex; align-items: center; gap: 8px; }
.card-h h2 svg, .card-h h3 svg { width: 14px; height: 14px; color: var(--text-2); }
.card-b { padding: 16px; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { padding: 9px 16px; text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl td.mono { font-size: 12px; color: var(--text-2); }
.tbl tr.rowlink { cursor: pointer; transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .tbl tr.rowlink:hover { background: #FBFAF8; } }
.tbl tr.is-new td:first-child { box-shadow: inset 3px 0 0 var(--accent-a); }
.tbl .t-main { display: block; font-weight: 500; color: var(--text-1); }
.tbl .t-sub { display: block; font-size: 11.5px; color: var(--text-3); }
.tbl a.t-main { text-decoration: none; }
.tbl a.t-main:hover { text-decoration: underline; text-underline-offset: 3px; }
.empty-row { padding: 28px 16px; text-align: center; font-size: 13px; color: var(--text-3); }
.wait { font: 500 12px var(--font-mono); }
.wait.late { color: var(--danger); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: 14px; background: var(--surface); margin-bottom: 20px; }
.kpi { padding: 14px 16px; border-left: 1px solid var(--border); }
.kpi:first-child { border-left: 0; }
.kpi b { display: block; font-size: 20px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--text-3); }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--border); } }

/* Review workspace: context · answer · facts */
.ws { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) minmax(0, 300px); gap: 20px; align-items: start; }
.col > * { min-width: 0; }
@media (max-width: 1439px) { .ws { grid-template-columns: minmax(0, 1fr) minmax(0, 300px); } .ws .ctx-col { grid-column: 1 / -1; order: 3; } }
@media (max-width: 959px) { .ws { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.access { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; color: var(--text-2); }
.access svg { width: 13px; height: 13px; flex: none; }
.convo { display: grid; gap: 12px; padding: 14px 16px; max-height: 520px; overflow-y: auto; }
.bub { justify-self: end; max-width: 92%; padding: 8px 12px; border-radius: 14px 14px 4px 14px; background: #EFEDE8; font-size: 13px; line-height: 1.5; }
.bub-r { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
.bub-r.flagged { padding: 8px; margin: -8px; border-radius: 10px; background: #FFF8DC; box-shadow: inset 0 0 0 1px rgba(200,150,20,.3); color: var(--text-1); }
.masked { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border-strong); font: 500 11.5px var(--font-mono); }
.masked button { border: 0; padding: 0; background: none; cursor: pointer; display: grid; color: var(--text-3); }
.masked button svg { width: 12px; height: 12px; }
.note-q { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: #FBFAF8; font-size: 13px; line-height: 1.5; }
.note-q svg { width: 13px; height: 13px; vertical-align: -2px; }
.note-q b { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); margin-bottom: 2px; }

.answer { display: grid; gap: 14px; padding: 16px; }
.answer-text { display: grid; gap: 10px; font-size: 14px; line-height: 1.6; }
.answer-text p { max-width: 68ch; }
.answer-text textarea { width: 100%; min-height: 92px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: #fff; resize: vertical;
  font-size: 14px; line-height: 1.55; outline: none; transition: border-color 150ms ease, box-shadow 150ms ease; }
.answer-text textarea:focus { border-color: var(--ink); box-shadow: var(--halo); }
.lock { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); }
.lock svg { width: 13px; height: 13px; flex: none; }
.vbadge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.vbadge svg { width: 13px; height: 13px; }
.vbadge.ok svg { color: var(--ok); }

/* Answer blocks (same markup as chat.html, static here) */
.gcard { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
.gc-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 600; }
.gc-h > span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.gc-h svg { width: 14px; height: 14px; color: var(--text-2); }
.gc-h .micro { font-weight: 400; font-family: var(--font-mono); }
.gc-note { padding: 9px 14px; border-top: 1px solid var(--border); background: #FBFAF8; font-size: 11.5px; color: var(--text-3); }
.cmp { display: grid; grid-template-columns: 1.3fr 1fr 1fr; min-width: 420px; font-size: 12.5px; }
.cmp > div { padding: 8px 14px; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.cmp .th { border-top: 0; font-size: 12px; font-weight: 600; }
.cmp .th small { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
.cmp .rk { color: var(--text-3); }
.cmp .on { background: #FFF8DC; font-weight: 500; }
.cmp .rc { background: #FFFCF0; }
.cmp .rc.on { background: #FFF3C4; }
.cmp .na { color: var(--text-3); }
.rec-badge { display: inline-flex; align-items: center; gap: 4px; width: fit-content; height: 20px; margin-top: 6px; padding: 0 8px; border-radius: 999px; background: #FFF3C4; color: var(--ink);
  font-size: 10.5px; font-weight: 600; box-shadow: 0 0 0 3px rgba(255,210,63,.35); }
.rec-badge svg { width: 11px; height: 11px; stroke-width: 2.4; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; color: var(--text-2); text-decoration: none; }
.src svg { width: 12px; height: 12px; }
@media (hover: hover) and (pointer: fine) { a.src:hover { border-color: rgba(200,150,20,.4); background: #FFF8DC; color: var(--text-1); } }

/* Facts list (right column) */
.facts { display: grid; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12.5px; }
.fact:first-child { border-top: 0; }
.fact > span:first-child { color: var(--text-3); }
.fact > b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.fact .sub { grid-column: 1 / -1; font-size: 11.5px; color: var(--text-3); }
.fact.warn .sub { color: #7A5A00; }
.fact.bad .sub { color: var(--danger); }

/* Checks */
.checks { display: grid; }
.chk { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.45; }
.chk:first-child { border-top: 0; }
.chk .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.chk .dot svg { width: 11px; height: 11px; stroke-width: 3; color: #fff; }
.chk.pass .dot { background: var(--ok); }
.chk.warn .dot { background: #FFF3C4; box-shadow: inset 0 0 0 1px rgba(200,150,20,.5); }
.chk.warn .dot svg { color: #7A5A00; }
.chk.fail .dot { background: var(--danger); }
.chk b { display: block; font-weight: 500; }
.chk small { display: block; font-size: 12px; color: var(--text-3); }
.chk.fail small { color: var(--danger); }
.chk.warn small { color: #7A5A00; }

/* Plan document (indicative simulation, laid out like the SECCI) */
.doc { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.answer, .decide, .sheet-b { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 640px) { .doc { padding: 16px; } }
.doc-label { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 10px; background: #FFF8DC; box-shadow: inset 0 0 0 1px rgba(200,150,20,.3); font-size: 12.5px; color: #6B5200; }
.doc-label svg { width: 14px; height: 14px; flex: none; }
.doc h3 { font-size: 13px; margin-bottom: 8px; }

    var out = '', x = 0, y = 0;
    while (x < n && y < m) {
      if (A[x] === B[y]) { out += esc(A[x]); x++; y++; }
      else if (L[x + 1][y] >= L[x][y + 1]) { out += '<del>' + esc(A[x]) + '</del>'; x++; }

    }

    while (y < m) out += '<ins>' + esc(B[y++]) + '</ins>';

  /* ═══════════════════════ Demo bridge with chat.html (localStorage) ═══════════════════════

  var REQ_KEY = 'raiffy.demo.requests', VER_KEY = 'raiffy.demo.verdicts';

  }
  function importRequests() {

      var r = { id: id, chatId: q.id, fromChat: true, status: 'open', createdAt: isoMinus(Math.max(0, Math.round((Date.now() - q.at) / 6e4))), client: { ref: 'Client ••4821', segment: 'Andrei P. · salary transfer' },

          card: q.snap ? { type: 'chatsim', snap: q.snap } : null, sources: q.sources || [], inputs: q.snap ? [['Amount', lei(q.snap.amount)], ['Term', q.snap.term + ' months'], ['Offer access', 'On']] : [['From', 'chat.html']] };

      var q = coQuote(r, st.rate), valid = liso(new Date(+NOW + r.co.band.validityDays * 864e5)).slice(0, 10);
      closeReview(r, 'approved');
      r.offer = { rate: st.rate, monthly: q.monthly, total: q.total, validUntil: valid, by: me().sign, conditions: st.mode === 'conditions' && st.salary ? ['salary paid into Raiffeisen'] : [] };
      CO_STATS.decided++; CO_STATS.specialist++;
      audit('Approved counter-offer', r.id, { diff: pct(r.co.list.rate) + ' → ' + pct(st.rate) + ', fee waived', reason: 'Matches ' + r.co.competitor.bank + ' total cost (client SECCI)' });
      toast('Offer approved, valid until ' + day(valid) + '. Logged for the win rate.', 'badge-check');
    }
    render(false);
  }

  /* ═══════════════════════ Events ═══════════════════════ */
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-role]'))) return setRole(el.dataset.role);
    if ((el = t.closest('tr.rowlink')) && !t.closest('a, button')) { if (el.dataset.href) location.hash = el.dataset.href; return; }
    if ((el = t.closest('[data-revtype]'))) { ui.revType = el.dataset.revtype; return render(false); }
    if ((el = t.closest('[data-revstatus]'))) { ui.revStatus = el.dataset.revstatus; return render(false); }
    if ((el = t.closest('[data-prodf]'))) { ui.prodFilter = el.dataset.prodf; return render(false); }
    if ((el = t.closest('[data-auditk]'))) { ui.auditKind = el.dataset.auditk; return render(false); }
    if ((el = t.closest('[data-jump]'))) { e.preventDefault(); var s = $(el.dataset.jump); if (s) s.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' });
      document.querySelectorAll('.secnav a').forEach(function (a) { a.classList.toggle('on', a === el); }); return; }
    if ((el = t.closest('[data-close-sheet]'))) { $('sheet').close(); return; }
    if ((el = t.closest('[data-unmask]'))) {
      var key = el.dataset.unmask, kind = el.dataset.kind, rid = key.split(':')[0];
      return ask('Unmask ' + kind, 'Reason (logged with your name)', 'Unmask', 'For example: the customer asked which account their salary goes into', function (reason, choice) {
        UNMASKED[key] = 1; audit('Unmasked data', rid + ' · ' + kind, { reason: choice + (reason ? ': ' + reason : '') }); toast('Unmasked. The reason is in the audit log.', 'eye'); render(false);
      }, ['Needed to answer the customer’s question', 'Checking for fraud', 'Complaint handling']);
    }
    if ((el = t.closest('[data-confirm]'))) return confirmAnswer(review(el.dataset.confirm));
    if ((el = t.closest('[data-confirm-plan]'))) return confirmAnswer(review(el.dataset.confirmPlan));
    if ((el = t.closest('[data-edit]'))) { var r1 = review(el.dataset.edit); ui.editing[r1.id] = { paras: r1.answer.paras.slice(), reason: '' }; render(false); var f = document.querySelector('[data-edit-para]'); if (f) f.focus(); return; }
    if ((el = t.closest('[data-edit-plan]'))) { ui.editing[el.dataset.editPlan] = { note: '', reason: '' }; render(false); $('pnote').focus(); return; }
    if ((el = t.closest('[data-cancel-edit]'))) { delete ui.editing[el.dataset.cancelEdit]; return render(false); }
    if ((el = t.closest('[data-send-edit]'))) return sendEdit(review(el.dataset.sendEdit));
    if ((el = t.closest('[data-send-plan-edit]'))) return sendPlanEdit(review(el.dataset.sendPlanEdit));
    if ((el = t.closest('[data-sched]'))) { ui.showSched[el.dataset.sched] = !ui.showSched[el.dataset.sched]; return render(false); }
    if ((el = t.closest('[data-return]'))) {
      var r2 = review(el.dataset.return);
      return ask('Return the plan', 'Note to the customer', 'Return to the chat', 'For example: rates changed since this plan, so Raiffy will rebuild it with today’s figures', function (note) {
        if (!note) return false;
        r2.returnNote = note; closeReview(r2, 'returned'); audit('Returned plan', r2.id, { reason: note });
        writeVerdict(r2, { level: 'returned', note: note }); toast('Returned to the customer with your note.', 'undo-2'); render(false);
      });
    }
    if ((el = t.closest('[data-pass]'))) { var r3 = review(el.dataset.pass); r3.passedTo = 'Cristina B., branch manager, Floreasca'; audit('Passed counter-offer', r3.id, { reason: 'Needs ' + LEVELS[r3.approvalLevel] }); toast('Passed to Cristina B.', 'forward'); return render(false); }
    if ((el = t.closest('[data-open-cause]'))) {
      var r4 = review(el.dataset.openCause), card = el.closest('.card'), kind = card.querySelector('[data-cause-kind]').value;
      var val = card.querySelector('[data-cause-value]').value;
      if (kind === 'parameter') { ui.pendingEdit = { entity: 'parameter', id: '', key: val, from: r4.id }; location.hash = 'parameters'; }
      else { var pid = card.querySelector('[data-cause-product]').value; ui.pendingEdit = { entity: 'product', id: pid, key: val, from: r4.id }; location.hash = 'products/' + pid; }
      return;
    }
    if ((el = t.closest('[data-edit-value]'))) { var a = el.dataset.editValue.split('|'); return openEditor(a[0], a[1], a[2]); }
    if ((el = t.closest('[data-rollback]'))) {
      var p = product(el.dataset.rollback), h = p.history[0];
      return openEditor('product', p.id, h.key, null, { value: h.from, rollback: true, source: 'Rollback of v' + h.version, note: 'Restores the value before v' + h.version + '.' });
    }
    if ((el = t.closest('[data-approve]'))) {
      var c = CHANGES.filter(function (x) { return x.id === el.dataset.approve; })[0];
      var res = applyChange(c, me().name);
      audit(res.scheduled ? 'Approved and scheduled' : 'Approved change', targetName(c), { diff: fv(target(c.entity, c.entityId, c.key), c.from) + ' → ' + fv(target(c.entity, c.entityId, c.key), c.to) });
      toast('Approved. ' + publishMsg(res)); return render(false);
    }
    if ((el = t.closest('[data-reject]'))) {
      var c2 = CHANGES.filter(function (x) { return x.id === el.dataset.reject; })[0];
      return ask('Reject ' + c2.id, 'Reason, sent to ' + c2.by, 'Reject', 'For example: the source is a draft, use the signed ALCO minutes', function (reason) {
        if (!reason) return false;
        c2.status = 'rejected'; c2.rejectedBy = me().name; c2.rejectReason = reason; audit('Rejected change', targetName(c2), { reason: reason }); toast('Rejected. ' + c2.by + ' sees your reason.', 'x'); render(false);
      });
    }
    if (t.closest('#export')) {
      var csv = 'when,who,action,what,diff,why\n' + AUDIT.map(function (a) { return [a.at, a.user, a.action, a.entity, a.diff, a.reason].map(function (x) { return '"' + String(x || '').replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
      var link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); link.download = 'raiffy-audit-log.csv'; link.click();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
      audit('Exported audit log', AUDIT.length + ' entries'); return;
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target, r;
    if (t.matches('[data-edit-para]')) { r = review(location.hash.split('/')[1]); ui.editing[r.id].paras[+t.dataset.editPara] = t.value; document.querySelector('[data-edit-live]').innerHTML = editLive(r); icons(); return; }
    if (t.matches('[data-edit-reason]')) { r = review(t.dataset.editReason); ui.editing[r.id].reason = t.value; document.querySelector('[data-edit-live]').innerHTML = editLive(r); icons(); return; }
    if (t.matches('[data-plan-note]')) { r = review(t.dataset.planNote); ui.editing[r.id].note = t.value; document.querySelector('[data-plan-live]').innerHTML = planLive(r); icons(); return; }
    if (t.matches('[data-plan-reason]')) { r = review(t.dataset.planReason); ui.editing[r.id].reason = t.value; document.querySelector('[data-plan-live]').innerHTML = planLive(r); icons(); return; }
    if (t.matches('[data-co-rate]')) { r = review(t.dataset.coRate); coState(r).rate = parseFloat(t.value.replace(',', '.')); t.setAttribute('aria-invalid', coErr(r)); document.querySelector('[data-co-live]').innerHTML = coLive(r); return; }
    if (t.matches('[data-co-reason]')) { coState(review(t.dataset.coReason)).reason = t.value; t.removeAttribute('aria-invalid'); return; }
    if (t.id === 'ed-val' || t.id === 'ed-from') { $('ed-err').hidden = true; return refreshImpact(); }
    if (t.id === 'audit-q') { ui.auditQ = t.value; var pos = t.selectionStart; render(false); var q = $('audit-q'); q.focus(); q.setSelectionRange(pos, pos); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-co-mode]')) { coState(review(t.dataset.coMode)).mode = t.value; render(false); var x = document.querySelector('[data-co-mode][value="' + t.value + '"]'); if (x) x.focus(); return; }
    if (t.matches('[data-co-salary]')) { coState(review(t.dataset.coSalary)).salary = t.checked; return; }
    if (t.matches('[data-cause-kind]')) {
      var card = t.closest('.card'), sel = card.querySelector('[data-cause-value]');
      card.querySelector('[data-cause-prod]').hidden = t.value === 'parameter';
      sel.innerHTML = t.value === 'parameter' ? paramOptions() : valueOptions(product(card.querySelector('[data-cause-product]').value));
      return;
    }
    if (t.matches('[data-cause-product]')) { t.closest('.card').querySelector('[data-cause-value]').innerHTML = valueOptions(product(t.value)); return; }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'ed-form') { e.preventDefault(); return submitEditor(); }
    if (f.id === 'ask-form') {
      e.preventDefault();
      var txt = $('ask-t').value.trim(), ch = f.querySelector('[name="ask-c"]:checked');
      var res = askCtx(txt, ch ? ch.value : '');
      if (res === false) { $('ask-err').hidden = false; $('ask-t').setAttribute('aria-invalid', 'true'); $('ask-t').focus(); return; }
      $('sheet').close(); askCtx = null; return;
    }
    if (f.matches('[data-co-form]')) { e.preventDefault(); return decideCounter(review(f.dataset.coForm)); }
  });
  $('sheet').addEventListener('close', function () { editorCtx = null; askCtx = null; });
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').close(); });

  /* Sidebar drawer */
  function closeSide() { $('app').classList.remove('side-open'); $('scrim').hidden = true; $('open-side').setAttribute('aria-expanded', 'false'); document.querySelector('.main').inert = false; }
  $('open-side').addEventListener('click', function () {
    $('app').classList.add('side-open'); $('scrim').hidden = false; $('open-side').setAttribute('aria-expanded', 'true'); document.querySelector('.main').inert = true;
    setTimeout(function () { var a = document.querySelector('.nav a'); if (a) a.focus(); }, 30);
  });
  $('scrim').addEventListener('click', function () { closeSide(); $('open-side').focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('app').classList.contains('side-open')) { closeSide(); $('open-side').focus(); } });
  narrow.addEventListener('change', closeSide);

  /* ═══════════════════════ Start ═══════════════════════ */
  seedReviews();
  importRequests();
  icons();
  render(false);
})();
</script>
</body>
</html>
